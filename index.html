<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>English Trainer</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#060b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="English">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060b14;--surf:#0c1625;--card:#111e35;--card2:#172540;
  --bd:#1b3050;--bd2:#253f65;
  --ac:#22d3ee;--acd:rgba(34,211,238,.1);--acg:rgba(34,211,238,.2);
  --gn:#34d399;--gnd:rgba(52,211,153,.1);
  --am:#fbbf24;--amd:rgba(251,191,36,.1);
  --rd:#f87171;--rdd:rgba(248,113,113,.1);
  --t1:#e2e8f0;--t2:#7d9ab5;--t3:#334e68;
  --r:12px;--rs:8px;
}
html,body{height:100%;font-family:Outfit,sans-serif;background:var(--bg);color:var(--t1)}
header{background:var(--surf);border-bottom:1px solid var(--bd);padding:env(safe-area-inset-top,0px) 20px 0 20px;position:sticky;top:0;z-index:99}
.hdr{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:56px;gap:12px}
.logo{font-size:17px;font-weight:700;white-space:nowrap}.logo em{color:var(--ac);font-style:normal}
nav{display:flex;gap:2px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:3px}
nav button{padding:6px 12px;font-size:13px;font-weight:500;font-family:inherit;background:none;border:none;color:var(--t2);border-radius:7px;cursor:pointer;transition:all .18s;white-space:nowrap}
nav button.on{background:var(--ac);color:#000;font-weight:700}
nav button:hover:not(.on){color:var(--t1);background:var(--card2)}
main{max-width:960px;margin:0 auto;padding:24px 16px}
.tab{display:none}.tab.on{display:block}
.sel{padding:8px 12px;font-size:13px;font-family:inherit;background:var(--card);color:var(--t1);border:1px solid var(--bd);border-radius:var(--rs);cursor:pointer;outline:none}
.sel:focus{border-color:var(--ac)}
.row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.btn-g{background:var(--card);border:1px solid var(--bd2);color:var(--t2);border-radius:var(--rs);padding:8px 14px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .18s}
.btn-g:hover{border-color:var(--ac);color:var(--ac)}
.lbl{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.9px;margin-bottom:10px}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:24px}
.scard{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;text-align:center}
.snum{font-size:36px;font-weight:800;line-height:1;margin-bottom:3px}
.slbl{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.7px}
.scard.a .snum{color:var(--ac)}.scard.b .snum{color:var(--gn)}.scard.c .snum{color:var(--am)}.scard.d .snum{color:var(--rd)}
.clist{display:flex;flex-direction:column;gap:7px;margin-bottom:24px}
.crow{background:var(--card);border:1px solid var(--bd);border-radius:var(--rs);padding:10px 14px;display:flex;align-items:center;gap:10px}
.cname{font-size:13px;font-weight:500;min-width:170px}
.cwrap{flex:1;height:5px;background:var(--bd2);border-radius:3px;overflow:hidden}
.cbar{height:100%;border-radius:3px;background:var(--ac);transition:width .5s}
.cct{font-size:12px;color:var(--t2);min-width:52px;text-align:right}
.btn-start{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ac);color:#000;border:none;border-radius:var(--r);padding:14px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .2s;width:100%;margin-bottom:10px}
.btn-start:hover{filter:brightness(1.08);transform:translateY(-1px)}
.spbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;font-size:13px;color:var(--t2)}
.spwrap{flex:1;margin:0 14px;height:4px;background:var(--bd2);border-radius:2px;overflow:hidden}
.spfill{height:100%;background:var(--ac);border-radius:2px;transition:width .3s}
.scene{perspective:1200px;margin-bottom:16px;cursor:pointer}
.flip{width:100%;height:360px;position:relative;transform-style:preserve-3d;transition:transform .48s cubic-bezier(.4,0,.2,1)}
.flip.flipped{transform:rotateY(180deg)}
.face{position:absolute;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:28px 32px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow-y:auto}
.face.bk{transform:rotateY(180deg);align-items:flex-start;text-align:left;justify-content:flex-start;padding-top:22px}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--acd);color:var(--ac);border:1px solid var(--acg);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;margin-bottom:18px}
.dot{width:6px;height:6px;border-radius:50%}
.word{font-size:48px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;margin-bottom:10px}
.word.md{font-size:30px;letter-spacing:-.4px}.word.sm{font-size:20px;letter-spacing:0}
.forms{font-size:13px;color:var(--am);background:var(--amd);border-radius:6px;padding:5px 11px;margin-bottom:10px;font-style:italic}
.tap{font-size:13px;color:var(--t3);margin-top:18px}
.spk{background:none;border:1px solid var(--bd2);border-radius:20px;color:var(--t2);padding:5px 13px;font-size:12px;font-family:inherit;cursor:pointer;transition:all .18s;display:inline-flex;align-items:center;gap:5px;margin-top:10px}
.spk:hover{border-color:var(--ac);color:var(--ac)}
.bk-de{font-size:28px;font-weight:700;color:var(--gn);margin:6px 0 8px}
.bk-en{font-size:13px;color:var(--t2);margin-bottom:4px}
.bk-div{width:100%;height:1px;background:var(--bd);margin:12px 0}
.exlbl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
.ex-en{font-size:14px;color:var(--t1);line-height:1.55;margin-bottom:5px}
.ex-de{font-size:13px;color:var(--t2);line-height:1.5;font-style:italic}
.fhint{text-align:center;font-size:12px;color:var(--t3);margin-bottom:12px}
.fhint.gone{display:none}
.rbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rbtns.gone{display:none}
.rbtn{padding:11px 6px;border:1px solid;border-radius:var(--rs);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:3px}
.rbtn .sub{font-size:10px;font-weight:400;opacity:.7}
.rbtn:hover{filter:brightness(1.25);transform:translateY(-1px)}
.r-a{background:var(--rdd);border-color:var(--rd);color:var(--rd)}
.r-h{background:var(--amd);border-color:var(--am);color:var(--am)}
.r-g{background:var(--gnd);border-color:var(--gn);color:var(--gn)}
.r-e{background:var(--acd);border-color:var(--ac);color:var(--ac)}
.kthint{text-align:center;font-size:12px;color:var(--t3);margin-top:10px}
.done{text-align:center;padding:50px 20px}
.done-ic{font-size:56px;margin-bottom:14px}
.done-ti{font-size:22px;font-weight:700;margin-bottom:8px}
.done-su{font-size:14px;color:var(--t2);margin-bottom:22px}
.qwrap{max-width:640px;margin:0 auto}
.qsc{display:flex;gap:20px;font-size:13px;color:var(--t2);margin-bottom:18px}
.qsc strong{color:var(--t1)}
.qcard{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:30px;text-align:center;margin-bottom:18px}
.qlbl{font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px}
.qword{font-size:32px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.qopt{background:var(--card);border:1px solid var(--bd2);border-radius:var(--r);padding:14px 12px;font-size:14px;font-weight:500;font-family:inherit;color:var(--t1);cursor:pointer;transition:all .18s;text-align:left;word-break:break-word;line-height:1.4}
.qopt:hover:not(:disabled){border-color:var(--ac);color:var(--ac);background:var(--acd)}
.qopt.ok{background:var(--gnd);border-color:var(--gn);color:var(--gn)}
.qopt.err{background:var(--rdd);border-color:var(--rd);color:var(--rd)}
.qopt:disabled{cursor:not-allowed}
.qfb{border-radius:var(--rs);padding:11px;font-weight:600;font-size:14px;margin-bottom:10px;display:none;text-align:center}
.qfb.ok{background:var(--gnd);color:var(--gn);display:block}
.qfb.err{background:var(--rdd);color:var(--rd);display:block}
.qex{font-size:13px;color:var(--t3);text-align:center;margin-bottom:12px;line-height:1.6;display:none}
.qex em{color:var(--t2);font-style:italic}
.qnext{background:var(--ac);color:#000;border:none;border-radius:var(--rs);padding:10px 24px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;display:none;margin:0 auto;transition:all .18s}
.qnext.show{display:block}.qnext:hover{filter:brightness(1.08)}
.brsearch{flex:1;min-width:200px;padding:9px 14px;font-size:14px;font-family:inherit;background:var(--card);color:var(--t1);border:1px solid var(--bd);border-radius:var(--rs);outline:none}
.brsearch:focus{border-color:var(--ac)}.brsearch::placeholder{color:var(--t3)}
.brstats{font-size:13px;color:var(--t2);margin-bottom:16px}
.brsec{margin-bottom:26px}
.brsec-hd{display:flex;align-items:center;justify-content:space-between;padding-bottom:9px;border-bottom:1px solid var(--bd);margin-bottom:10px}
.brsec-ti{font-size:14px;font-weight:600}.brsec-ct{font-size:12px;color:var(--t2)}
.brgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.brcard{background:var(--card);border:1px solid var(--bd);border-radius:var(--rs);padding:11px 13px;transition:all .18s;cursor:default}
.brcard:hover{border-color:var(--bd2);background:var(--card2)}
.brcard.kn{border-color:rgba(52,211,153,.25);background:rgba(52,211,153,.03)}
.br-en{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.br-en.kn{color:var(--gn)}
.br-de{font-size:13px;color:var(--t2);margin-top:2px}
.br-fm{font-size:11px;color:var(--am);margin-top:3px}
.br-ex{font-size:12px;color:var(--t3);margin-top:5px;font-style:italic;line-height:1.4;display:none}
.brcard:hover .br-ex{display:block}
.br-st{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-top:5px}
.st-n{color:var(--t3)}.st-l{color:var(--am)}.st-k{color:var(--gn)}
.spkm{background:none;border:none;cursor:pointer;font-size:12px;padding:0;opacity:.45;transition:opacity .15s}
.spkm:hover{opacity:1}
.empty{text-align:center;padding:40px;color:var(--t2)}
@media(max-width:640px){
  .sgrid{grid-template-columns:repeat(2,1fr)}
  .word{font-size:32px}.word.md{font-size:20px}.word.sm{font-size:16px}
  .rbtns{grid-template-columns:repeat(2,1fr)}
  nav button{padding:5px 8px;font-size:11px}
  .logo{font-size:14px}
  .qopts{grid-template-columns:1fr}
  .cname{min-width:120px}
}
/* ── Hero: Streak + Tagesziel ── */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.herocard{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:14px}
.flame{font-size:34px;line-height:1}
.heronum{font-size:28px;font-weight:800;line-height:1;color:var(--ac)}
.herolbl{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.6px;margin-top:3px}
.herosub{font-size:12px;color:var(--gn);margin-top:2px}
.ring{position:relative;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--bd2) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ringin{position:absolute;width:44px;height:44px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--t1)}
/* ── CTA + Datenzeile ── */
.cta2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.cta2 .btn-g{width:100%;justify-content:center;text-align:center}
.datarow{display:flex;gap:8px;justify-content:center;margin-top:14px}
.datarow .btn-g{flex:1;text-align:center}
/* ── Schreibmodus ── */
.subtoggle{display:inline-flex;gap:2px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:3px;margin-bottom:16px}
.subtoggle button{padding:7px 16px;font-size:13px;font-weight:500;font-family:inherit;background:none;border:none;color:var(--t2);border-radius:7px;cursor:pointer;transition:all .18s}
.subtoggle button.on{background:var(--ac);color:#000;font-weight:700}
.wrinput{width:100%;margin-top:18px;padding:14px 16px;font-size:19px;font-weight:500;font-family:inherit;text-align:center;background:var(--bg);color:var(--t1);border:1px solid var(--bd2);border-radius:var(--rs);outline:none}
.wrinput:focus{border-color:var(--ac)}
.wrinput:disabled{opacity:.7}
.wrbtns{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.wr-check{background:var(--ac);color:#000;border:none;border-radius:var(--rs);padding:11px 28px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .18s}
.wr-check:hover{filter:brightness(1.08)}
.gapsent{font-size:19px;font-weight:600;line-height:1.7;text-align:center}
.gapblank{display:inline-block;min-width:90px;border-bottom:2px solid var(--ac);color:var(--ac);font-weight:700}
.gaphint{font-size:13px;color:var(--t2);font-style:italic;margin-top:12px;text-align:center}

.syncst{text-align:center;font-size:12px;color:var(--t2);margin-top:10px}
/* ── Beschreiben ── */
.dscard{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:24px 26px;margin-bottom:14px}
.dstitle{font-size:26px;font-weight:800;letter-spacing:-.4px;margin:6px 0 8px;line-height:1.15}
.dstask{font-size:14px;color:var(--t2);line-height:1.55}
.dsta{width:100%;min-height:150px;resize:vertical;padding:14px 16px;font-size:16px;line-height:1.55;font-family:inherit;background:var(--bg);color:var(--t1);border:1px solid var(--bd2);border-radius:var(--rs);outline:none}
.dsta:focus{border-color:var(--ac)}
.dsmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--t3);margin:6px 2px 12px}
.dsbtns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{background:var(--acd);border:1px solid var(--acg);color:var(--ac);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.fbk{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px 18px;margin-bottom:10px}
.fbk h4{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.fbk p{font-size:14px;line-height:1.6}
.corr{padding:8px 0;border-top:1px solid var(--bd);font-size:14px;line-height:1.5}
.corr:first-of-type{border-top:none}
.corr .w{color:var(--rd);text-decoration:line-through}
.corr .r{color:var(--gn);font-weight:600}
.corr .y{color:var(--t2);font-size:13px;display:block;margin-top:2px}
.nw{font-size:14px;padding:5px 0}.nw b{color:var(--ac)}.nw span{color:var(--t2)}
.score{display:inline-block;background:var(--gnd);color:var(--gn);border-radius:8px;padding:3px 10px;font-weight:700;font-size:13px;margin-left:6px}
.dsnote{font-size:13px;color:var(--t2);text-align:center;padding:12px;line-height:1.5}
.warn{background:var(--amd);color:var(--am);border-radius:var(--rs);padding:10px 12px;font-size:13px;margin-bottom:10px}

/* ── Kartei: Navigation + Rückblick ── */
.subtoggle.fcs{display:flex;width:fit-content;max-width:100%;overflow-x:auto}
.fcnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.fcnav span{font-size:12px;color:var(--t2);text-align:center}
.fcnav .btn-g:disabled{opacity:.35;cursor:default}
.fcnav .btn-g:disabled:hover{border-color:var(--bd2);color:var(--t2)}
.rbtn.cur{box-shadow:inset 0 0 0 2px currentColor}
.rbtn.dim{opacity:.45}
.rvin{font-size:13px;color:var(--t2);margin-top:8px}
.rvin b{color:var(--t1)}
.fctype{margin-top:8px}
/* ── Stimme + Diktieren ── */
.vbox{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px}
.vb-row{display:flex;gap:8px;flex-wrap:wrap}
.vb-row #vb-voice{flex:1;min-width:200px;max-width:100%}
.vb-hint{font-size:12px;color:var(--t2);line-height:1.55;margin-top:10px}
.vb-hint b,.vb-hint i{color:var(--t1)}
#ds-mic.rec{background:var(--rdd);border-color:var(--rd);color:var(--rd);animation:micp 1.4s ease-in-out infinite}
@keyframes micp{50%{box-shadow:0 0 0 5px rgba(248,113,113,.15)}}
/* ── Einstellungen ── */
.st-sec{padding:12px 0;border-top:1px solid var(--bd)}
.st-sec:first-child{border-top:none;padding-top:0}
.st-sec:last-child{padding-bottom:0}
.st-h{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.st-ok,.st-off{font-size:11px;font-weight:700;border-radius:10px;padding:2px 8px}
.st-ok{background:var(--gnd);color:var(--gn)}.st-off{background:var(--card2);color:var(--t3)}
.st-msg{font-size:12px;margin-top:6px;align-self:center}
.st-ta{min-height:90px;font-size:12px;font-family:ui-monospace,Menlo,monospace;margin-top:8px}
.vbox a{color:var(--ac)}
.vb-row .brsearch{min-width:180px}
.st-adv{margin-top:6px}.st-adv summary{font-size:12px;color:var(--t2);cursor:pointer}
.wr-also{font-size:13px;font-weight:400;margin-top:6px;opacity:.9}
/* ── Version & Updates ── */
.updbar{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:98;background:var(--acd);border-bottom:1px solid var(--acg);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.updin{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:var(--t1);flex-wrap:wrap}
.updin .wr-check{padding:8px 16px;font-size:13px}
.verbox{margin-top:14px;font-size:12px;color:var(--t2)}
.ver-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.ver-row b{color:var(--t1)}
.ver-row .btn-g{padding:5px 10px;font-size:12px}
.ver-new{margin-top:10px;text-align:center;color:var(--ac);font-weight:600}
.ver-new .wr-check{padding:6px 14px;font-size:12px;margin-left:8px}
.ver-notes{margin-top:8px;text-align:center;line-height:1.5}
/* ── Grammatik ── */
.gr-list{display:flex;flex-direction:column;gap:8px}
.gr-item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:13px 16px;font-family:inherit;color:var(--t1);cursor:pointer;transition:all .18s}
.gr-item:hover{border-color:var(--ac);background:var(--card2)}
.gr-ic{font-size:26px;line-height:1;flex-shrink:0;width:34px;text-align:center}
.gr-it{flex:1;min-width:0}
.gr-ti{font-size:15px;font-weight:600}
.gr-su{font-size:12px;color:var(--t2);margin-top:2px}
.gr-st{font-size:12px;color:var(--t2);white-space:nowrap}

<script>
// ── Web-App-Modus ──
// Innerhalb von Claude (Artefakt) passiert hier nichts. Als eigenstaendige Web-App (z. B. GitHub Pages)
// ersetzen ein eigener Anthropic-API-Key (KI-Feedback) und ein privates GitHub-Gist (Sync) die Claude-Funktionen.
(function(){
  const web=location.protocol==='file:'||/(^|\.)github\.io$|^localhost$|^127\.0\.0\.1$|\.test$/i.test(location.hostname);
  if(!web||(window.claude&&window.claude.use))return;
  window.ET_STANDALONE=true;
  const ET_SYNC=false; // Sync zwischen Geraeten (GitHub-Gist) vorerst ausgeschaltet
  const KK='et7_apikey',GT='et7_ghtoken',GI='et7_gistid',GF='english-trainer-sync.json';
  const ls=k=>{try{return localStorage.getItem(k)||''}catch(e){return''}};
  const err=(code,message)=>Object.assign(new Error(message),{code});

  async function ask(input,opts){
    opts=opts||{};
    const key=ls(KK);if(!key)throw err('not_granted','Kein API-Key hinterlegt');
    const model=opts.modelTier==='quick'?'claude-haiku-5-5':opts.modelTier==='complex'?'claude-opus-5-5':'claude-sonnet-5-5';
    const messages=typeof input==='string'?[{role:'user',content:input}]:input;
    let r;
    try{
      r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:opts.signal,headers:{
        'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model,max_tokens:opts.maxTokens||2000,system:opts.system,messages})});
    }catch(e){
      if(e&&e.name==='AbortError')throw err('cancelled','Abgebrochen');
      throw err('network','Keine Verbindung zur Claude-API');
    }
    if(!r.ok){
      let m='';try{m=((await r.json()).error||{}).message||''}catch(e){}
      if(r.status===429||r.status===529)throw err('rate_limited',m||'Zu viele Anfragen');
      if(r.status===401||r.status===403)throw err('bad_key','API-Key ungültig'+(m?': '+m:''));
      throw err('api_error','API-Fehler '+r.status+(m?': '+m:''));
    }
    const j=await r.json();
    const text=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
    return {text,truncated:j.stop_reason==='max_tokens'};
  }
  const sample=Object.assign((i,o)=>ask(i,o),{
    json:async(i,o)=>{
      const {text}=await ask(i,Object.assign({system:'Reply with a single valid JSON object only. No markdown, no code fences, no text before or after it.'},o));
      const a=text.indexOf('{'),b=text.lastIndexOf('}');
      if(a<0||b<a)throw err('bad_json','Antwort war kein JSON');
      return JSON.parse(text.slice(a,b+1));
    },
    limits:async()=>({images:false})
  });


  async function gh(path,method,body){
    const r=await fetch('https://api.github.com'+path,{method:method||'GET',cache:'no-store',headers:Object.assign({
      'Authorization':'Bearer '+ls(GT),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body?{'Content-Type':'application/json'}:{}),
      body:body?JSON.stringify(body):undefined});
    if(!r.ok)throw err('gh_'+r.status,'GitHub-Fehler '+r.status);
    return r.status===204?null:r.json();
  }
  async function findGist(){
    let id=ls(GI);if(id)return id;
    for(let page=1;page<=5&&!id;page++){
      const list=await gh('/gists?per_page=100&page='+page);
      if(!list||!list.length)break;
      const f=list.find(x=>x.files&&x.files[GF]);if(f)id=f.id;
    }
    if(!id){const c=await gh('/gists','POST',{description:'English Trainer – Lernstand (automatisch, nicht löschen)',public:false,files:{[GF]:{content:'{}'}}});id=c.id}
    try{localStorage.setItem(GI,id)}catch(e){}
    return id;
  }
  const db={doc:()=>({
    async get(){
      const id=await findGist();
      const gst=await gh('/gists/'+id);
      const f=gst&&gst.files&&gst.files[GF];
      let content=f&&f.content;
      if(f&&f.truncated&&f.raw_url)content=await (await fetch(f.raw_url,{cache:'no-store'})).text();
      let data=null;try{data=JSON.parse(content||'{}')}catch(e){}
      return {exists:!!(data&&data.state),data:()=>data||{}};
    },
    async set(v){const id=await findGist();await gh('/gists/'+id,'PATCH',{files:{[GF]:{content:JSON.stringify(v)}}})}
  })};

  window.ET_web={ask,gh,findGist,keys:{KK,GT,GI}};
  window.ET_HANDOFF=!ls(KK);
  window.claude={use:async name=>{
    if(name==='sample')return ls(KK)?sample:null;
    if(name==='db')return ET_SYNC&&ls(GT)?db:null;
    if(name==='user')return ET_SYNC&&ls(GT)?{id:async()=>'me'}:null;
    return null;
  }};
})();
</script>

  {en:"finish",de:"beenden / fertigstellen",cat:"vb",f:null,ex:"I need to finish this before the deadline.",exde:"Ich muss das vor der Deadline fertigstellen."},
  {en:"ask",de:"fragen / bitten",cat:"vb",f:null,ex:"Don't hesitate to ask if anything is unclear.",exde:"Z\u00f6gere nicht zu fragen, wenn etwas unklar ist."},
  {en:"work",de:"arbeiten / funktionieren",cat:"vb",f:null,ex:"How exactly does this process work?",exde:"Wie genau funktioniert dieser Prozess?"},
  {en:"talk",de:"reden / sprechen",cat:"vb",f:null,ex:"We need to talk about the next steps.",exde:"Wir m\u00fcssen \u00fcber die n\u00e4chsten Schritte reden."},
  {en:"look",de:"schauen / aussehen",cat:"vb",f:null,ex:"Let's look at the data together.",exde:"Lass uns die Daten gemeinsam anschauen."},
  {en:"hold",de:"halten / abhalten",cat:"vb",f:"hold \u2013 held \u2013 held",ex:"We'll hold the meeting on Thursday afternoon.",exde:"Wir halten das Meeting am Donnerstagnachmittag ab."},
  {en:"pay",de:"bezahlen",cat:"vb",f:"pay \u2013 paid \u2013 paid",ex:"How do you usually pay when travelling?",exde:"Wie bezahlst du normalerweise auf Reisen?"},
  {en:"however",de:"jedoch / allerdings",cat:"conn",f:null,ex:"The plan is good. However, we need more data.",exde:"Der Plan ist gut. Allerdings brauchen wir mehr Daten."},
  {en:"therefore",de:"deshalb / daher",cat:"conn",f:null,ex:"The deadline moved up; therefore, we must act fast.",exde:"Die Deadline wurde vorgezogen; deshalb m\u00fcssen wir schnell handeln."},
  {en:"although",de:"obwohl / auch wenn",cat:"conn",f:null,ex:"Although it was hard, we delivered on time.",exde:"Obwohl es schwer war, haben wir p\u00fcnktlich geliefert."},
  {en:"furthermore",de:"au\u00dferdem / des Weiteren",cat:"conn",f:null,ex:"The team is skilled. Furthermore, they work well together.",exde:"Das Team ist qualifiziert. Au\u00dferdem arbeiten sie gut zusammen."},
  {en:"moreover",de:"dar\u00fcber hinaus",cat:"conn",f:null,ex:"The cost is low. Moreover, the quality is excellent.",exde:"Die Kosten sind niedrig. Dar\u00fcber hinaus ist die Qualit\u00e4t hervorragend."},
  {en:"on the other hand",de:"andererseits",cat:"conn",f:null,ex:"It is expensive. On the other hand, it saves a lot of time.",exde:"Es ist teuer. Andererseits spart es viel Zeit."},
  {en:"as a result",de:"infolgedessen / daher",cat:"conn",f:null,ex:"We practiced daily. As a result, we improved fast.",exde:"Wir \u00fcbten t\u00e4glich. Infolgedessen verbesserten wir uns schnell."},
  {en:"in addition",de:"zus\u00e4tzlich / au\u00dferdem",cat:"conn",f:null,ex:"In addition, please also send the raw data.",exde:"Zus\u00e4tzlich schick bitte auch die Rohdaten."},
  {en:"for example",de:"zum Beispiel",cat:"conn",f:null,ex:"I enjoy sports, for example, basketball and running.",exde:"Ich mag Sport, zum Beispiel Basketball und Laufen."},
  {en:"in contrast",de:"im Gegensatz dazu",cat:"conn",f:null,ex:"He works slowly. In contrast, she is very fast.",exde:"Er arbeitet langsam. Im Gegensatz dazu ist sie sehr schnell."},
  {en:"in conclusion",de:"abschlie\u00dfend / zusammenfassend",cat:"conn",f:null,ex:"In conclusion, the project was a great success.",exde:"Abschlie\u00dfend war das Projekt ein gro\u00dfer Erfolg."},
  {en:"first of all",de:"zun\u00e4chst einmal",cat:"conn",f:null,ex:"First of all, let me thank everyone for coming.",exde:"Zun\u00e4chst einmal m\u00f6chte ich mich bei allen bedanken."},
  {en:"to sum up",de:"zusammenfassend / kurz gesagt",cat:"conn",f:null,ex:"To sum up, we need to focus on quality.",exde:"Zusammenfassend m\u00fcssen wir uns auf Qualit\u00e4t konzentrieren."},
  {en:"in other words",de:"mit anderen Worten",cat:"conn",f:null,ex:"He is unreliable. In other words, don't count on him.",exde:"Er ist unzuverl\u00e4ssig. Mit anderen Worten: Z\u00e4hl nicht auf ihn."},
  {en:"despite",de:"trotz",cat:"conn",f:null,ex:"Despite the setbacks, the team stayed positive.",exde:"Trotz der R\u00fcckschl\u00e4ge blieb das Team positiv."},
  {en:"due to",de:"aufgrund von / wegen",cat:"conn",f:null,ex:"Due to heavy traffic, I arrived late.",exde:"Aufgrund des starken Verkehrs kam ich sp\u00e4t an."},
  {en:"whereas",de:"wohingegen / w\u00e4hrend",cat:"conn",f:null,ex:"I prefer emails, whereas my boss prefers calls.",exde:"Ich bevorzuge E-Mails, wohingegen mein Chef Anrufe bevorzugt."},
  {en:"unless",de:"sofern nicht / au\u00dfer wenn",cat:"conn",f:null,ex:"Don't submit unless you have proofread it.",exde:"Reiche es nicht ein, sofern du es nicht gepr\u00fcft hast."},
  {en:"as long as",de:"solange / sofern",cat:"conn",f:null,ex:"As long as you keep practicing, you will improve.",exde:"Solange du weiter \u00fcbst, wirst du dich verbessern."},
  {en:"in order to",de:"um ... zu / damit",cat:"conn",f:null,ex:"I study English daily in order to speak fluently.",exde:"Ich lerne t\u00e4glich Englisch, um flie\u00dfend sprechen zu k\u00f6nnen."},
  {en:"even though",de:"obwohl / selbst wenn",cat:"conn",f:null,ex:"Even though it was hard, I never gave up.",exde:"Obwohl es schwer war, habe ich nie aufgegeben."},
  {en:"such as",de:"wie zum Beispiel / wie etwa",cat:"conn",f:null,ex:"I enjoy activities such as hiking and cycling.",exde:"Ich mag Aktivit\u00e4ten wie zum Beispiel Wandern und Radfahren."},
  {en:"rather than",de:"anstatt / lieber als",cat:"conn",f:null,ex:"Let's discuss this in person rather than by email.",exde:"Lass uns das pers\u00f6nlich besprechen statt per E-Mail."},
  {en:"instead of",de:"anstatt / statt",cat:"conn",f:null,ex:"Instead of complaining, let's find a real solution.",exde:"Anstatt zu klagen, lass uns eine echte L\u00f6sung finden."},
  {en:"as well as",de:"sowie / und auch",cat:"conn",f:null,ex:"She speaks French as well as Spanish fluently.",exde:"Sie spricht sowohl Franz\u00f6sisch als auch Spanisch flie\u00dfend."},
  {en:"not only ... but also",de:"nicht nur ... sondern auch",cat:"conn",f:null,ex:"He is not only smart but also very hardworking.",exde:"Er ist nicht nur klug, sondern auch sehr flei\u00dfig."},
  {en:"both ... and",de:"sowohl ... als auch",cat:"conn",f:null,ex:"Both the design and the content look professional.",exde:"Sowohl das Design als auch der Inhalt sehen professionell aus."},
  {en:"either ... or",de:"entweder ... oder",cat:"conn",f:null,ex:"Either we fix it now or things will get worse.",exde:"Entweder wir reparieren es jetzt oder es wird schlimmer."},
  {en:"neither ... nor",de:"weder ... noch",cat:"conn",f:null,ex:"Neither option seems ideal at this point.",exde:"Keine der Optionen erscheint an diesem Punkt ideal."},
  {en:"to be honest",de:"ehrlich gesagt",cat:"ph",f:null,ex:"To be honest, I wasn't sure about this at first.",exde:"Ehrlich gesagt war ich anfangs nicht sicher dar\u00fcber."},
  {en:"as far as I know",de:"soweit ich wei\u00df",cat:"ph",f:null,ex:"As far as I know, the deadline is still Friday.",exde:"Soweit ich wei\u00df, ist die Deadline immer noch Freitag."},
  {en:"it depends",de:"es kommt drauf an",cat:"ph",f:null,ex:"It depends on how much time and budget we have.",exde:"Es kommt darauf an, wie viel Zeit und Budget wir haben."},
  {en:"I have no idea",de:"ich habe keine Ahnung",cat:"ph",f:null,ex:"I have no idea what went wrong \u2013 let me check.",exde:"Ich habe keine Ahnung, was schiefgelaufen ist."},
  {en:"let me think",de:"lass mich kurz nachdenken",cat:"ph",f:null,ex:"Let me think ... I would go with option B.",exde:"Lass mich nachdenken ... Ich w\u00fcrde Option B w\u00e4hlen."},
  {en:"that's a good point",de:"das ist ein guter Punkt",cat:"ph",f:null,ex:"That's a good point \u2013 I hadn't thought of that.",exde:"Das ist ein guter Punkt \u2013 daran hatte ich nicht gedacht."},
  {en:"in my opinion",de:"meiner Meinung nach",cat:"ph",f:null,ex:"In my opinion, we should wait a bit longer.",exde:"Meiner Meinung nach sollten wir etwas l\u00e4nger warten."},
  {en:"what do you mean?",de:"was meinst du?",cat:"ph",f:null,ex:"What exactly do you mean by saying it's urgent?",exde:"Was genau meinst du damit, dass es dringend ist?"},
  {en:"could you repeat that?",de:"k\u00f6nntest du das wiederholen?",cat:"ph",f:null,ex:"Sorry, could you repeat that a bit more slowly?",exde:"Entschuldigung, k\u00f6nntest du das etwas langsamer wiederholen?"},
  {en:"I totally agree",de:"ich stimme v\u00f6llig zu",cat:"ph",f:null,ex:"I totally agree \u2013 that is the right approach.",exde:"Ich stimme v\u00f6llig zu \u2013 das ist der richtige Ansatz."},
  {en:"I'm not sure about that",de:"da bin ich mir nicht sicher",cat:"ph",f:null,ex:"I'm not sure about that \u2013 let me double-check.",exde:"Da bin ich mir nicht sicher \u2013 lass mich das pr\u00fcfen."},
  {en:"to be fair",de:"um fair zu sein",cat:"ph",f:null,ex:"To be fair, it wasn't entirely his fault.",exde:"Um fair zu sein, war es nicht ausschlie\u00dflich seine Schuld."},
  {en:"the thing is",de:"das Problem ist / die Sache ist",cat:"ph",f:null,ex:"The thing is, we simply don't have enough budget.",exde:"Die Sache ist, wir haben einfach nicht genug Budget."},
  {en:"fair enough",de:"fair enough / einverstanden",cat:"ph",f:null,ex:"Fair enough \u2013 let's go with your suggestion then.",exde:"Einverstanden \u2013 dann machen wir es so."},
  {en:"go ahead",de:"bitte / mach weiter",cat:"ph",f:null,ex:"Go ahead \u2013 I'm all ears.",exde:"Bitte \u2013 ich h\u00f6re aufmerksam zu."},
  {en:"does that make sense?",de:"ergibt das Sinn?",cat:"ph",f:null,ex:"I've explained the process \u2013 does that make sense?",exde:"Ich habe den Prozess erkl\u00e4rt \u2013 ergibt das Sinn?"},
  {en:"to be on the safe side",de:"um sicher zu gehen",cat:"ph",f:null,ex:"Let's double-check, just to be on the safe side.",exde:"Lass uns nochmal pr\u00fcfen, nur um sicher zu gehen."},
  {en:"that said",de:"das gesagt / allerdings",cat:"ph",f:null,ex:"That said, we still need to review the numbers.",exde:"Allerdings m\u00fcssen wir die Zahlen noch \u00fcberpr\u00fcfen."},
  {en:"How's it going?",de:"Wie l\u00e4uft's? / Wie geht's?",cat:"st",f:null,ex:"Hey! How's it going? Busy week again?",exde:"Hey! Wie l\u00e4uft's? Wieder eine stressige Woche?"},
  {en:"Not bad, thanks!",de:"Nicht schlecht, danke!",cat:"st",f:null,ex:"Not bad, thanks! Could always be worse, right?",exde:"Nicht schlecht, danke! K\u00f6nnte immer schlimmer sein, oder?"},
  {en:"What have you been up to?",de:"Was hast du so gemacht?",cat:"st",f:null,ex:"Long time no see! What have you been up to?",exde:"Lange nicht gesehen! Was hast du so gemacht?"},
  {en:"Long time no see!",de:"Lange nicht gesehen!",cat:"st",f:null,ex:"Oh wow, long time no see! How have you been?",exde:"Wow, lange nicht gesehen! Wie ist es dir ergangen?"},
  {en:"How was your weekend?",de:"Wie war dein Wochenende?",cat:"st",f:null,ex:"How was your weekend? Did you do anything fun?",exde:"Wie war dein Wochenende? Hast du etwas Spa\u00dfiges gemacht?"},
  {en:"I'm swamped",de:"ich bin total \u00fcberh\u00e4uft",cat:"st",f:null,ex:"Sorry, I can't chat \u2013 I'm completely swamped right now.",exde:"Sorry, ich kann nicht reden \u2013 ich bin v\u00f6llig \u00fcberh\u00e4uft."},
  {en:"Looking forward to it!",de:"Ich freue mich darauf!",cat:"st",f:null,ex:"Friday sounds perfect. Looking forward to it!",exde:"Freitag klingt perfekt. Ich freue mich darauf!"},
  {en:"Catch you later!",de:"Bis sp\u00e4ter!",cat:"st",f:null,ex:"I have to run now \u2013 catch you later!",exde:"Ich muss jetzt los \u2013 bis sp\u00e4ter!"},
  {en:"That sounds great!",de:"Das klingt super!",cat:"st",f:null,ex:"A team dinner on Friday? That sounds great!",exde:"Ein Teamessen am Freitag? Das klingt super!"},
  {en:"Keep in touch!",de:"Bleib in Kontakt!",cat:"st",f:null,ex:"Great catching up \u2013 please keep in touch!",exde:"Sch\u00f6n, auf dem neuesten Stand zu sein \u2013 bleib in Kontakt!"},
  {en:"How are you holding up?",de:"Wie h\u00e4ltst du durch?",cat:"st",f:null,ex:"It's been a tough project \u2013 how are you holding up?",exde:"Es war ein hartes Projekt \u2013 wie h\u00e4ltst du durch?"},
  {en:"efficient",de:"effizient",cat:"adj",f:null,ex:"We need a more efficient way to handle this.",exde:"Wir brauchen eine effizientere Methode daf\u00fcr."},
  {en:"relevant",de:"relevant / wichtig",cat:"adj",f:null,ex:"Is this information still relevant to the topic?",exde:"Ist diese Information noch relevant f\u00fcr das Thema?"},
  {en:"significant",de:"bedeutend / erheblich",cat:"adj",f:null,ex:"There has been a significant improvement this quarter.",exde:"Es gab eine erhebliche Verbesserung in diesem Quartal."},
  {en:"challenging",de:"herausfordernd",cat:"adj",f:null,ex:"This project is challenging but very rewarding.",exde:"Dieses Projekt ist herausfordernd, aber sehr lohnend."},
  {en:"straightforward",de:"unkompliziert / eindeutig",cat:"adj",f:null,ex:"The process is actually quite straightforward.",exde:"Der Prozess ist eigentlich ziemlich unkompliziert."},
  {en:"flexible",de:"flexibel",cat:"adj",f:null,ex:"You need to be flexible when plans suddenly change.",exde:"Du musst flexibel sein, wenn sich Pl\u00e4ne pl\u00f6tzlich \u00e4ndern."},
  {en:"reliable",de:"zuverl\u00e4ssig",cat:"adj",f:null,ex:"She is the most reliable person on our team.",exde:"Sie ist die zuverl\u00e4ssigste Person in unserem Team."},
  {en:"urgent",de:"dringend",cat:"adj",f:null,ex:"This is urgent \u2013 we need a response today.",exde:"Das ist dringend \u2013 wir brauchen heute eine Antwort."},
  {en:"precise",de:"pr\u00e4zise / genau",cat:"adj",f:null,ex:"Please be more precise when reporting the numbers.",exde:"Bitte sei pr\u00e4ziser, wenn du die Zahlen berichtest."},
  {en:"confident",de:"selbstsicher / zuversichtlich",cat:"adj",f:null,ex:"He sounds very confident in his presentations.",exde:"Er klingt sehr selbstsicher in seinen Pr\u00e4sentationen."},
  {en:"available",de:"verf\u00fcgbar / erreichbar",cat:"adj",f:null,ex:"Are you available for a quick call tomorrow?",exde:"Bist du morgen f\u00fcr einen kurzen Anruf verf\u00fcgbar?"},
  {en:"responsible",de:"verantwortlich",cat:"adj",f:null,ex:"Who exactly is responsible for this task?",exde:"Wer ist genau f\u00fcr diese Aufgabe verantwortlich?"},
  {en:"outstanding",de:"hervorragend",cat:"adj",f:null,ex:"Your work this month has been truly outstanding.",exde:"Deine Arbeit in diesem Monat war wirklich hervorragend."},
  {en:"overwhelming",de:"\u00fcberw\u00e4ltigend",cat:"adj",f:null,ex:"The amount of new information was overwhelming at first.",exde:"Die Menge an neuen Informationen war zun\u00e4chst \u00fcberw\u00e4ltigend."},
  {en:"beneficial",de:"vorteilhaft / n\u00fctzlich",cat:"adj",f:null,ex:"Regular practice is highly beneficial for your progress.",exde:"Regelm\u00e4\u00dfiges \u00dcben ist sehr vorteilhaft f\u00fcr deinen Fortschritt."},
  {en:"demanding",de:"anspruchsvoll / fordernd",cat:"adj",f:null,ex:"It's a demanding role, but also very rewarding.",exde:"Es ist eine anspruchsvolle Rolle, aber auch sehr erf\u00fcllend."},
  {en:"practical",de:"praktisch / praxisorientiert",cat:"adj",f:null,ex:"Let's focus on practical solutions we can implement now.",exde:"Konzentrieren wir uns auf praktische L\u00f6sungen, die wir sofort umsetzen k\u00f6nnen."},
  {en:"let me get back to you",de:"ich melde mich zur\u00fcck",cat:"kom",f:null,ex:"Let me get back to you on that by tomorrow morning.",exde:"Ich melde mich dazu bis morgen fr\u00fch."},
  {en:"I'll follow up",de:"ich werde nachfassen",cat:"kom",f:null,ex:"I'll follow up with all the details after our call.",exde:"Ich werde nach unserem Anruf mit allen Details nachfassen."},
  {en:"just to confirm",de:"nur zur Best\u00e4tigung",cat:"kom",f:null,ex:"Just to confirm \u2013 the meeting is at 3 PM, right?",exde:"Nur zur Best\u00e4tigung \u2013 das Meeting ist um 15 Uhr, richtig?"},
  {en:"could you walk me through?",de:"k\u00f6nntest du mich durchf\u00fchren?",cat:"kom",f:null,ex:"Could you walk me through the process step by step?",exde:"K\u00f6nntest du mich Schritt f\u00fcr Schritt durch den Prozess f\u00fchren?"},
  {en:"I'll keep you posted",de:"ich halte dich auf dem Laufenden",cat:"kom",f:null,ex:"I'll keep you posted on any major updates.",exde:"Ich halte dich \u00fcber alle wichtigen Updates auf dem Laufenden."},
  {en:"to clarify",de:"klarstellen / kl\u00e4ren",cat:"kom",f:null,ex:"Let me clarify exactly what I mean by that.",exde:"Lass mich klarstellen, was ich damit genau meine."},
  {en:"to suggest",de:"vorschlagen",cat:"kom",f:null,ex:"I'd like to suggest a completely different approach.",exde:"Ich w\u00fcrde gerne einen v\u00f6llig anderen Ansatz vorschlagen."},
  {en:"to apologize",de:"sich entschuldigen",cat:"kom",f:null,ex:"I'd like to apologize sincerely for the delay.",exde:"Ich m\u00f6chte mich aufrichtig f\u00fcr die Verz\u00f6gerung entschuldigen."},
  {en:"to raise a point",de:"einen Punkt ansprechen",cat:"kom",f:null,ex:"I'd like to raise an important point about the timeline.",exde:"Ich m\u00f6chte einen wichtigen Punkt bez\u00fcglich des Zeitplans ansprechen."},
  {en:"to get in touch",de:"Kontakt aufnehmen",cat:"kom",f:null,ex:"Feel free to get in touch with me anytime.",exde:"Z\u00f6gere nicht, jederzeit Kontakt mit mir aufzunehmen."},
  {en:"to follow through",de:"etwas durchziehen / einhalten",cat:"kom",f:null,ex:"It's important to always follow through on commitments.",exde:"Es ist wichtig, immer seine Zusagen einzuhalten."},
  {en:"right away",de:"sofort / auf der Stelle",cat:"zt",f:null,ex:"I'll get started on that right away.",exde:"Ich fange sofort damit an."},
  {en:"in the meantime",de:"in der Zwischenzeit",cat:"zt",f:null,ex:"In the meantime, let's prepare the slides.",exde:"In der Zwischenzeit bereiten wir die Folien vor."},
  {en:"eventually",de:"irgendwann / letztendlich",cat:"zt",f:null,ex:"Eventually, all this practice will pay off.",exde:"Letztendlich wird sich diese \u00dcbung auszahlen."},
  {en:"beforehand",de:"im Voraus / vorher",cat:"zt",f:null,ex:"Please read the full agenda beforehand.",exde:"Bitte lies die vollst\u00e4ndige Agenda vorher."},
  {en:"afterwards",de:"danach / im Anschluss",cat:"zt",f:null,ex:"We can discuss all the results afterwards.",exde:"Wir k\u00f6nnen alle Ergebnisse danach besprechen."},
  {en:"so far",de:"bisher / bis jetzt",cat:"zt",f:null,ex:"So far, all the feedback has been very positive.",exde:"Bisher war das gesamte Feedback sehr positiv."},
  {en:"as soon as possible",de:"so schnell wie m\u00f6glich (ASAP)",cat:"zt",f:null,ex:"Please send me the file as soon as possible.",exde:"Bitte schick mir die Datei so schnell wie m\u00f6glich."},
  {en:"from now on",de:"von jetzt an / ab sofort",cat:"zt",f:null,ex:"From now on, let's have a check-in every Monday.",exde:"Von jetzt an machen wir jeden Montag einen Check-in."},
  {en:"at the moment",de:"gerade / im Moment",cat:"zt",f:null,ex:"At the moment I'm focused on finishing the report.",exde:"Im Moment konzentriere ich mich auf den Bericht."},
  {en:"on time",de:"p\u00fcnktlich / rechtzeitig",cat:"zt",f:null,ex:"The project was delivered perfectly on time.",exde:"Das Projekt wurde p\u00fcnktlich geliefert."},
  {en:"ahead of schedule",de:"vor dem Zeitplan",cat:"zt",f:null,ex:"Great news \u2013 we are actually ahead of schedule!",exde:"Tolle Neuigkeiten \u2013 wir sind tats\u00e4chlich vor dem Zeitplan!"},
  {en:"roughly",de:"ungef\u00e4hr / grob",cat:"zt",f:null,ex:"It takes roughly 30 minutes to get there.",exde:"Es dauert ungef\u00e4hr 30 Minuten, dorthin zu kommen."},
  {en:"in the long run",de:"langfristig / auf lange Sicht",cat:"zt",f:null,ex:"In the long run, this investment will pay off.",exde:"Auf lange Sicht wird sich diese Investition auszahlen."},
  {en:"Could you explain?",de:"K\u00f6nntest du erkl\u00e4ren?",cat:"fq",f:null,ex:"Could you explain what you mean by that term?",exde:"K\u00f6nntest du erkl\u00e4ren, was du mit diesem Begriff meinst?"},
  {en:"What exactly do you mean?",de:"Was genau meinst du?",cat:"fq",f:null,ex:"What exactly do you mean by high priority?",exde:"Was genau meinst du mit hoher Priorit\u00e4t?"},
  {en:"How does this work?",de:"Wie funktioniert das?",cat:"fq",f:null,ex:"How does this entire process work in practice?",exde:"Wie funktioniert dieser gesamte Prozess in der Praxis?"},
  {en:"When is this due?",de:"Wann ist das f\u00e4llig?",cat:"fq",f:null,ex:"When exactly is the final report due?",exde:"Wann genau ist der abschlie\u00dfende Bericht f\u00e4llig?"},
  {en:"Is there any update?",de:"Gibt es ein Update?",cat:"fq",f:null,ex:"Is there any update on the current situation?",exde:"Gibt es ein Update zur aktuellen Situation?"},
  {en:"What's the next step?",de:"Was ist der n\u00e4chste Schritt?",cat:"fq",f:null,ex:"The call went well \u2013 what's the next step?",exde:"Der Anruf lief gut \u2013 was ist der n\u00e4chste Schritt?"},
  {en:"Could you elaborate?",de:"K\u00f6nntest du das ausf\u00fchren?",cat:"fq",f:null,ex:"That's interesting \u2013 could you elaborate a bit more?",exde:"Das ist interessant \u2013 k\u00f6nntest du das etwas ausf\u00fchren?"},
  {en:"What are your thoughts?",de:"Was denkst du? / Deine Meinung?",cat:"fq",f:null,ex:"What are your thoughts on this new proposal?",exde:"Was sind deine Gedanken zu diesem neuen Vorschlag?"},
  {en:"frustrated",de:"frustriert",cat:"gf",f:null,ex:"I'm a bit frustrated with the lack of progress.",exde:"Ich bin etwas frustriert \u00fcber den mangelnden Fortschritt."},
  {en:"motivated",de:"motiviert",cat:"gf",f:null,ex:"I'm really motivated to finish this project strong.",exde:"Ich bin wirklich motiviert, dieses Projekt stark abzuschlie\u00dfen."},

const SK='et7';
let P=(()=>{try{return JSON.parse(localStorage.getItem(SK))||{}}catch{return{}}})();

// ── META: Streak, Tagesziel, Statistik ──
const MK='et7_meta';
let M=(()=>{try{return JSON.parse(localStorage.getItem(MK))||{}}catch{return{}}})();
const saveM=()=>{try{localStorage.setItem(MK,JSON.stringify(M))}catch(e){};schedulePush()};
function bumpDay(correct){
  const t=todayMeta();
  if(M.dayOf!==t){M.dayOf=t;M.todayCount=0}
  if(M.lastDay!==t){
    M.streak=(M.lastDay===addDMeta(t,-1))?(M.streak||0)+1:1;
    M.lastDay=t;
  }
  M.todayCount=(M.todayCount||0)+1;
  M.totalReviews=(M.totalReviews||0)+1;
  if(correct)M.totalCorrect=(M.totalCorrect||0)+1;
  saveM();
}
const today=()=>new Date().toISOString().split('T')[0];
const addD=(s,n)=>{const d=new Date(s);d.setDate(d.getDate()+n);return d.toISOString().split('T')[0]};
const todayMeta=today;const addDMeta=addD;
const wid=w=>w.en+'|'+w.cat;
const st=w=>{const p=P[wid(w)];if(!p||!p.reps)return'new';if(p.interval>=7)return'known';return'learning'};
const isDue=w=>{const p=P[wid(w)];if(!p||!p.reps)return true;return p.due<=today()};
function doRate(w,r){
  const id=wid(w);const p=P[id]||{interval:0,ease:2.5,due:today(),reps:0,lapses:0};
  if(!p.firstDay)p.firstDay=today();
  if(r==='again'){p.interval=1;p.lapses=(p.lapses||0)+1;p.ease=Math.max(1.3,p.ease-.2);p.reps=0}
  else if(r==='hard'){p.interval=Math.max(1,Math.ceil(p.interval*1.2));p.ease=Math.max(1.3,p.ease-.15);p.reps++}
  else if(r==='good'){p.interval=p.reps===0?1:Math.ceil(p.interval*p.ease);p.reps++}
  else{p.interval=p.reps===0?4:Math.ceil(p.interval*p.ease*1.3);p.ease=Math.min(3,p.ease+.15);p.reps++}
  p.due=addD(today(),p.interval);p.t=Date.now();P[id]=p;save();bumpDay(r!=='again');
}
// ── Tagespensum: begrenzte neue Woerter pro Tag + echte Wiederholungen ──
const newPerDay=()=>M.newPerDay||15;
const newToday=()=>Object.values(P).filter(x=>x&&x.firstDay===today()).length;
const dueReviews=pool=>pool.filter(w=>{const p=P[wid(w)];return p&&p.due<=today()});
const freshWords=pool=>pool.filter(w=>!P[wid(w)]);
function dailyDeck(pool){const allow=Math.max(0,newPerDay()-newToday());return dueReviews(pool).concat(freshWords(pool).slice(0,allow));}

// ── SPEAK ──
const speak=(t,l)=>{try{if(audCur){audCur.pause();audCur=null}}catch(e){}if(/^en/i.test(l||'en-GB')&&useRec()&&playRec(t))return;if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=l||'en-GB';try{const v=pickVoice(u.lang);if(v==='SYS'){const dv=allVoices().find(x=>x.default&&/^en/i.test(x.lang||''));if(dv){u.voice=dv;u.lang=dv.lang}else u.lang='en-US'}else if(v){u.voice=v;u.lang=v.lang}}catch(e){}u.rate=vRate();speechSynthesis.speak(u)};

const spkEx=()=>{if(fcDeck[fcView])speak(fcDeck[fcView].ex,'en-GB')};

function goTo(t){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));
  g('tab-'+t).classList.add('on');
  document.querySelector(`nav button[data-t="${t}"]`).classList.add('on');
  if(t==='dash')renderDash();if(t==='fc'){if(!fcDeck.length||fcView>=fcDeck.length)initFC();else renderFC()}if(t==='desc')initDS();if(t==='br')renderBR();if(t==='gr')initGR();
}
g('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-t]');if(b)goTo(b.dataset.t)});

function renderDash(){
  renderHero();
  const tot=V.length,kn=V.filter(w=>st(w)==='known').length,lr=V.filter(w=>st(w)==='learning').length,due=dailyDeck(V).length;
  g('d-stats').innerHTML=`
    <div class="scard a"><div class="snum">${tot}</div><div class="slbl">Gesamt</div></div>
    <div class="scard b"><div class="snum">${kn}</div><div class="slbl">Gelernt</div></div>
    <div class="scard c"><div class="snum">${lr}</div><div class="slbl">Am Lernen</div></div>
    <div class="scard d"><div class="snum">${due}</div><div class="slbl">F&auml;llig heute</div></div>`;
  let h='';
  Object.entries(CATL).forEach(([k,label])=>{
    const ws=V.filter(w=>w.cat===k);
    const got=ws.filter(w=>st(w)==='known').length;
    const pct=ws.length?Math.round(got/ws.length*100):0;
    h+=`<div class="crow"><div class="cname">${label}</div><div class="cwrap"><div class="cbar" style="width:${pct}%"></div></div><div class="cct">${got} / ${ws.length}</div></div>`;
  });
  g('d-cats').innerHTML=h;
  renderVoiceBox();
  if(g('go-gr')){const gd=GL.filter(l=>gGet(l.id).r).length;g('go-gr').innerHTML='\u{1F4D0} Grammatik fürs Sprechen · '+gd+' / '+GL.length+' Lektionen';}
}

const stC={new:'#22d3ee',learning:'#fbbf24',known:'#34d399'};
const stL={new:'Neu',learning:'Am Lernen',known:'Gelernt'};
const fvoc=cat=>cat==='all'?V:V.filter(w=>w.cat===cat);
const shuf=a=>[...a].sort(()=>Math.random()-.5);

// Kartei = Aufdecken + Schreiben + Lueckentext in einem Tab.
// fcIdx: naechste noch nicht bewertete Karte · fcView: gerade angezeigte Karte (<= fcIdx) · fcLog: Bewertungen dieser Session
let fcSub='flip',fcView=0,fcLog=[];
function initFC(){
  setFcSub('tr');
  const cat=g('fc-cat').value,mode=g('fc-mode').value;
  let pool=fvoc(cat);
  if(mode==='due')pool=dailyDeck(pool);
  else if(mode==='new')pool=pool.filter(w=>st(w)==='new');
  else if(mode==='weak')pool=pool.filter(w=>{const p=P[wid(w)];return p&&p.lapses>0});
  fcDeck=shuf(pool);fcIdx=0;fcView=0;fcLog=[];fcFlipped=false;fcTot=fcDeck.length;fcDone=0;
  renderFC();
}
function setFcSub(s){
  {const dsel=g('fc-dir');if(dsel&&dsel.selectedIndex<0)dsel.value='de';}
  fcSub=s;
  document.querySelectorAll('#fc-sub button').forEach(b=>b.classList.toggle('on',b.dataset.s===s));
  g('fc-dir').style.display=s==='gap'?'none':'';
}
function fcSides(w){const d=g('fc-dir').value;return {d,front:d==='en'?w.en:w.de,back:d==='en'?w.de:w.en}}
function fcSnap(w){const p=P[wid(w)];return p?JSON.parse(JSON.stringify(p)):null}
function fcAnswer(i,r,extra){const w=fcDeck[i];fcLog[i]=Object.assign({prev:fcSnap(w),r},extra);doRate(w,r);if(fcIdx<=i)fcIdx=i+1;}
function fcGo(d){const t=fcView+d;if(t<0||t>fcIdx||t>fcDeck.length)return;fcView=t;renderFC()}

function renderFC(){
  const el=g('fc-main');fcFlipped=false;
  if(!fcDeck.length){
    const dm=g('fc-mode').value==='due';
    el.innerHTML=`<div class="done"><div class="done-ic">${dm?'\u{1F389}':'\u{1F634}'}</div><div class="done-ti">${dm?'Tagespensum geschafft!':'Keine Karten verfügbar'}</div><div class="done-su">${dm?'Für heute ist alles erledigt. Mit „Alle Karten“ kannst du zusätzlich üben.':'Wähle einen anderen Modus.'}</div><button class="btn-g" id="btn-all-fc">Alle Karten üben</button></div>`;
    g('btn-all-fc').onclick=()=>{g('fc-mode').value='all';initFC()};
    updFCP();return;
  }
  if(fcView>=fcDeck.length){
    const wl=fcLog.filter(l=>l&&l.sub!=='flip'),ok=wl.filter(l=>l.res!=='no').length;
    el.innerHTML=`<div class="done"><div class="done-ic">\u{1F389}</div><div class="done-ti">Session abgeschlossen!</div><div class="done-su">${fcTot} Karten bearbeitet${wl.length?` · ${Math.round(ok/wl.length*100)}% richtig geschrieben`:''} – sehr gut!<br>Mit „← Zurück“ kannst du dir die Karten nochmal anschauen.</div><button class="btn-g" id="btn-again-fc">Nochmal starten</button></div>`;
    g('btn-again-fc').onclick=initFC;
    updFCP();renderDash();return;
  }
  const w=fcDeck[fcView];
  if(fcLog[fcView])renderReview(w,fcLog[fcView]);
  else if(fcSub==='flip')renderFlip(w);
  else renderWrite(w);
  updFCP();
}

function renderWrite(w){
  const el=g('fc-main');
  const gap=fcSub==='gap'?buildGap(w):null;
  const S=fcSides(w);
  let label,promptHTML,src='',answer;
  if(gap){
    answer=gap.answer;
    label=`\u{1F9E9} Lücke füllen · ${esc(CATL[w.cat])}`;
    promptHTML=`<div class="gapsent">${esc(gap.pre)}<span class="gapblank">&nbsp;?&nbsp;</span>${esc(gap.post)}</div><div class="gaphint">\u{1F1E9}\u{1F1EA} ${esc(w.exde)}</div>`;
  }else{
    answer=S.back;
    label=(S.d==='en'?'\u{1F1EC}\u{1F1E7} → \u{1F1E9}\u{1F1EA} schreibe auf Deutsch':'\u{1F1E9}\u{1F1EA} → \u{1F1EC}\u{1F1E7} schreibe auf Englisch')+` · ${esc(CATL[w.cat])}`+(fcSub==='gap'?' · kein Lückensatz':'');
    promptHTML=`<div class="qword">${esc(S.front)}</div>`;
    if(S.d==='en')src=`<button class="spk" id="wr-spk-src" style="margin:8px auto 0">\u{1F50A} Anhören</button>`;
  }
  el.innerHTML=`
    <div class="qcard">
      <div class="qlbl">${label}</div>
      ${promptHTML}
      ${src}
      <input class="wrinput" id="wr-in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Antwort eingeben …">
    </div>
    <div class="qfb" id="wr-fb"></div>
    <div class="qex" id="wr-ex"></div>
    <div class="wrbtns" id="wr-btns">
      <button class="btn-g" id="wr-reveal">Antwort zeigen</button>
      <button class="wr-check" id="wr-check">Prüfen ✓</button>
    </div>
    <button class="qnext" id="wr-next">Nächste →</button>`;
  const inp=g('wr-in');
  try{inp.focus({preventScroll:true})}catch(e){}
  let done=false;
  const check=reveal=>{
    if(done)return;done=true;
    const lang=gap||S.d!=='en'?'en':'de';
    const m=reveal?{res:'no'}:checkAnswer(inp.value,w,answer,lang,!gap);
    const res=m.res,idx=fcView;
    const r=res==='exact'||res==='alt'?'good':res==='no'?'again':'hard';
    fcAnswer(idx,r,{sub:fcSub,res,inp:reveal?'':inp.value.trim()});
    const fb=g('wr-fb');
    const others=gap?[]:otherAnswers(w,answer,lang,m.hit,res==='alt'||res==='no');
    const alsoTxt=(lbl,list)=>list.length?`<div class="wr-also">${lbl}: ${list.map(x=>'<b>'+esc(x)+'</b>').join(' \u00b7 ')}</div>`:'';
    const also=alsoTxt(res==='no'?'Auch richtig w\u00e4re':'Auch richtig',others);
    if(res==='exact'){fb.innerHTML='✅ Richtig! Sehr gut!'+also;fb.className='qfb ok'}
    else if(res==='alt'){fb.innerHTML='✅ Richtig! Im Trainer steht: <b>'+esc(answer)+'</b>'+also;fb.className='qfb ok'}
    else if(res==='typo'){fb.innerHTML='\u{1F7E1} Fast! Richtig geschrieben: <b>'+esc(m.hit||answer)+'</b>'+also;fb.className='qfb ok'}
    else if(res==='close'){fb.innerHTML='\u{1F7E1} Passt sinngem\u00e4\u00df! Genau hei\u00dft es: <b>'+esc(m.hit||answer)+'</b>'+also;fb.className='qfb ok'}
    else{
      fb.innerHTML=(reveal?'\u{1F4A1} Antwort: <b>':'❌ Richtig wäre: <b>')+esc(answer)+'</b>'+also+(reveal?'':'<div style="margin-top:8px"><button class="btn-g" id="wr-ovr">\u2713 War doch richtig</button></div>');
      fb.className='qfb err';
      if(g('wr-ovr'))g('wr-ovr').onclick=()=>{
        const l=fcLog[idx];if(!l)return;const id=wid(w);
        if(l.prev)P[id]=JSON.parse(JSON.stringify(l.prev));else delete P[id];
        l.r='good';l.res='override';doRate(w,'good');
        fb.className='qfb ok';fb.innerHTML='✅ Als richtig gez\u00e4hlt.'+alsoTxt('Im Trainer steht',[answer].concat(others));updFCP();
        try{g('wr-next').focus({preventScroll:true})}catch(e){}
      };
    }
    inp.disabled=true;
    g('wr-ex').innerHTML='\u{1F4AC} '+esc(w.ex)+'<br><em>'+esc(w.exde)+'</em><br><button class="spk" id="wr-spk-ex" style="margin-top:8px">\u{1F50A} Satz anhören</button>';
    g('wr-ex').style.display='block';
    g('wr-btns').style.display='none';
    g('wr-next').classList.add('show');
    g('wr-spk-ex').onclick=()=>speak(w.ex,'en-GB');
    updFCP();
    try{g('wr-next').focus({preventScroll:true})}catch(e){}
  };
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check(false)}});
  g('wr-check').onclick=()=>check(false);
  g('wr-reveal').onclick=()=>check(true);
  g('wr-next').onclick=()=>{fcView++;renderFC()};
  if(g('wr-spk-src'))g('wr-spk-src').onclick=()=>speak(w.en,'en-GB');
}

// Rueckblick auf eine schon bewertete Karte: alles sichtbar, Bewertung aenderbar
function renderReview(w,l){
  const el=g('fc-main');
  const S=fcSides(w),s=st(w);
  const RB={again:['r-a','\u{1F534} Nochmal'],hard:['r-h','\u{1F7E1} Schwer'],good:['r-g','\u{1F7E2} Gut'],easy:['r-e','⭐ Leicht']};
  const resTxt=l.sub==='flip'?'':(l.res==='exact'?'✅ richtig geschrieben':l.res==='alt'?'✅ richtig (andere \u00dcbersetzung)':l.res==='close'?'\u{1F7E1} sinngem\u00e4\u00df richtig':l.res==='override'?'✅ als richtig gez\u00e4hlt':l.res==='typo'?'\u{1F7E1} fast richtig geschrieben':(l.inp?'❌ falsch geschrieben':'\u{1F4A1} Antwort angezeigt'));
  el.innerHTML=`
    <div class="qcard">
      <div class="pill"><span class="dot" style="background:${stC[s]}"></span>${esc(CATL[w.cat])} · schon gelernt</div>
      <div class="bk-en" style="font-size:16px">${esc(S.front)}</div>
      <div class="bk-de">${esc(S.back)}</div>
      ${w.f&&w.f!=='regular'?`<div class="forms" style="display:inline-block">\u{1F4CB} ${esc(w.f)}</div>`:''}
      ${resTxt?`<div class="rvin">${resTxt}${l.inp?` · deine Eingabe: <b>${esc(l.inp)}</b>`:''}</div>`:''}
      <div class="bk-div"></div>
      <div class="ex-en">\u{1F4AC} ${esc(w.ex)}</div>
      <div class="ex-de">\u{1F1E9}\u{1F1EA} ${esc(w.exde)}</div>
      <button class="spk" id="rv-spk-w">\u{1F50A} Wort</button> <button class="spk" id="rv-spk-e">\u{1F50A} Beispiel</button>
    </div>
    <div class="fhint">Deine Bewertung – tippe eine andere an, um sie zu ändern</div>
    <div class="rbtns">${Object.keys(RB).map(r=>`<button class="rbtn ${RB[r][0]}${l.r===r?' cur':' dim'}" data-r="${r}">${RB[r][1]}<span class="sub">${l.r===r?'aktuell':'ändern'}</span></button>`).join('')}</div>
    <div style="text-align:center;margin-top:16px"><button class="wr-check" id="rv-cont">Weiter lernen ⏭</button></div>`;
  g('rv-spk-w').onclick=()=>speak(w.en,'en-GB');
  g('rv-spk-e').onclick=()=>speak(w.ex,'en-GB');
  el.querySelector('.rbtns').onclick=e=>{const b=e.target.closest('[data-r]');if(b)rerateFC(b.dataset.r)};
  g('rv-cont').onclick=()=>{fcView=fcIdx;renderFC()};
}
function rerateFC(r){
  const i=fcView,l=fcLog[i];if(!l||l.r===r)return;
  const w=fcDeck[i],id=wid(w);
  if(l.prev)P[id]=JSON.parse(JSON.stringify(l.prev));else delete P[id];
  l.r=r;doRate(w,r);renderFC();
}

function flipCard(){
  if(fcFlipped||!g('cflip'))return;fcFlipped=true;
  g('cflip').classList.add('flipped');
  g('fhint').classList.add('gone');
  g('rbtns').classList.remove('gone');
}
function rateFC(r){if(!fcFlipped)return;fcAnswer(fcView,r,{sub:'flip'});fcView++;renderFC()}
function updFCP(){
  fcDone=fcIdx;
  const pct=fcTot?Math.round(fcDone/fcTot*100):0;
  g('fc-ct').textContent=fcDone+' / '+fcTot+' Karten';
  g('fc-bar').style.width=pct+'%';g('fc-pct').textContent=pct+'%';
  const wl=fcLog.filter(l=>l&&l.sub!=='flip'),ok=wl.filter(l=>l.res!=='no').length;
  const sc=g('fc-score');
  if(wl.length||fcSub!=='flip'){sc.style.display='';sc.innerHTML=`✅ Richtig: <strong>${ok}</strong> &nbsp;&middot;&nbsp; ❌ Falsch: <strong>${wl.length-ok}</strong>`}
  else sc.style.display='none';
  const nv=g('fc-nav');
  if(!fcDeck.length){nv.style.display='none';return}
  nv.style.display='';
  g('fc-prev').disabled=fcView<=0;
  g('fc-fwd').disabled=fcView>=fcIdx;
  g('fc-pos').textContent=fcView>=fcDeck.length?'Ende der Session':('Karte '+(fcView+1)+' / '+fcDeck.length+(fcLog[fcView]?' · schon gelernt':''));
}
document.addEventListener('keydown',e=>{
  if(!g('tab-fc').classList.contains('on'))return;
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if(typing)return;
  if(e.key==='ArrowLeft'){e.preventDefault();fcGo(-1);return}
  if(e.key==='ArrowRight'){e.preventDefault();fcGo(1);return}
  if(fcSub!=='flip'||fcLog[fcView]||fcView>=fcDeck.length)return;
  if(e.code==='Space'){e.preventDefault();flipCard()}
  if(fcFlipped){if(e.key==='1')rateFC('again');if(e.key==='2')rateFC('hard');if(e.key==='3')rateFC('good');if(e.key==='4')rateFC('easy')}
});
g('fc-sub').addEventListener('click',e=>{const b=e.target.closest('button[data-s]');if(!b)return;setFcSub(b.dataset.s);if(fcDeck.length)renderFC()});
g('btn-reload-fc').onclick=initFC;
g('fc-prev').onclick=()=>fcGo(-1);
g('fc-fwd').onclick=()=>fcGo(1);
g('fc-cat').onchange=initFC;
g('fc-mode').onchange=initFC;
g('fc-dir').onchange=()=>{if(fcDeck.length)renderFC()};

function pickTaboo(){
  const pool=V.filter(w=>w.en&&w.en.split(' ').length<=3&&!/[\/(]/.test(w.en));
  const w=pool[Math.floor(Math.random()*pool.length)];
  return {c:'taboo',de:w.de,en:w.en,task:'Erkl\u00e4re das englische Wort \u201e'+w.en+'\u201c auf Englisch, ohne es selbst zu benutzen. Jemand soll erraten k\u00f6nnen, was gemeint ist.',h:[],word:w.en,ex:w.ex};
}
function newDS(){
  const cat=g('ds-cat').value;
  if(cat==='taboo'||(cat==='all'&&Math.random()<.15)){dsCur=pickTaboo();}
  else{
    const pool=DS.map((x,i)=>i).filter(i=>cat==='all'||DS[i].c===cat);
    let i=pool[Math.floor(Math.random()*pool.length)];
    if(pool.length>1&&i===dsLastIdx)i=pool[(pool.indexOf(i)+1)%pool.length];
    dsLastIdx=i;dsCur=DS[i];

  renderDS();
}

async function checkDS(){
  if(dictBusy()){dictStatus('\u23F3 Moment \u2013 erst das Diktat beenden, dann Feedback holen.');return}
  const txt=g('ds-in').value.trim();
  const fb=g('ds-fb');
  if((txt.match(/\S+/g)||[]).length<5){fb.innerHTML='<div class="warn">Schreib mindestens ein, zwei ganze S\u00e4tze \u2013 genau das Suchen nach W\u00f6rtern ist das Training.</div>';return}
  const t=dsCur,isT=t.c==='taboo';
  let tabooWarn='';
  if(isT){const re=new RegExp('\\b'+t.word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');if(re.test(txt))tabooWarn='<div class="warn">\u26A0\uFE0F Du hast das Wort \u201e'+s_(t.word)+'\u201c selbst benutzt \u2013 versuch es nochmal ohne.</div>';}
  if(window.ET_HANDOFF){
    const pr=dsPrompt(t,txt);const copied=openClaude(pr);
    countDS();
    fb.innerHTML=tabooWarn+handoffNote(copied,pr,'ds-next');
    wireHandoff(fb,pr);g('ds-next').onclick=newDS;
    return;
  }
  if(!dsSample){
    countDS();
    fb.innerHTML=tabooWarn+selfCheckHTML(t);
    g('ds-next').onclick=newDS;
    return;
  }
  if(dsBusy)return;dsBusy=true;
  g('ds-check').disabled=true;g('ds-stop').style.display='';
  fb.innerHTML=tabooWarn+'<div class="dsnote">\u{1F914} Claude liest deine Beschreibung \u2026 das kann ein paar Sekunden dauern.</div>';
  dsCtl=new AbortController();
  const taskDesc=isT?`Explain the English word "${t.word}" in English WITHOUT using the word itself, so that someone could guess it.`:`Describe / talk about: "${t.de}" (English: ${t.en}). Task (German): ${t.task}`;
  const prompt=`You are a friendly, honest English coach for a German native speaker (roughly intermediate level) who wants to speak English more freely at work and in everyday life. The learner did a free description exercise to practise finding words on their own.

Exercise: ${taskDesc}

Learner's text:
"""${txt}"""

Give feedback. Explanations must be in GERMAN, short and concrete. English examples stay in English. Be encouraging but honest: point out real mistakes (grammar, wrong word, German-sounding phrasing), ignore tiny style matters. Do not invent mistakes; if the text is good, say so.

Reply with ONLY a JSON object, no markdown, in exactly this shape:
{"score": <integer 1-10 for how clear and correct it is>,
 "summary": "<1-2 German sentences: what was good, what to work on>",
 "corrections": [{"wrong": "<exact phrase from the text>", "right": "<corrected English>", "why": "<short German reason>"}],
 "better": "<the learner's text rewritten as natural, fluent English, same content, similar length>",
 "words": [{"en": "<useful English word or phrase for this topic the learner did not use>", "de": "<German meaning>"}],
 ${isT?'"guess": "<what word a listener would most likely guess from the explanation, and in German whether the explanation works>",':''}
 "tip": "<one practical German tip for next time>"}
Max 6 corrections (most important first), 3-5 words.`;
  try{
    const r=await dsSample.json(prompt,{signal:dsCtl.signal,modelTier:'default',cache:false});
    countDS();
    fb.innerHTML=tabooWarn+feedbackHTML(r,isT);
    const sp=g('ds-spk-better');if(sp)sp.onclick=()=>speak(String(r.better||''),'en-GB');
    const ag=g('ds-again');if(ag)ag.onclick=()=>{g('ds-fb').innerHTML='';g('ds-in').focus()};
    const nx=g('ds-next');if(nx)nx.onclick=newDS;
  }catch(e){
    const code=e&&e.code;
    if(code==='cancelled'){fb.innerHTML='<div class="dsnote">Abgebrochen.</div>';}
    else if(code==='not_granted'){dsSample=null;g('ds-ai').style.display='none';countDS();fb.innerHTML='<div class="dsnote">KI-Feedback wurde nicht erlaubt \u2013 hier zur Selbstkontrolle:</div>'+selfCheckHTML(t);g('ds-next').onclick=newDS;if(g('ds-check'))g('ds-check').textContent='\u2705 Fertig';}
    else if(code==='rate_limited'){fb.innerHTML='<div class="warn">Gerade zu viele Anfragen \u2013 warte kurz und versuch es dann nochmal.</div>';}
    else{fb.innerHTML='<div class="warn">Feedback konnte nicht geladen werden. Versuch es gleich nochmal.</div>';}
  }finally{
    dsBusy=false;dsCtl=null;
    if(g('ds-check'))g('ds-check').disabled=false;
    if(g('ds-stop'))g('ds-stop').style.display='none';
  }
}
function feedbackHTML(r,isT){
  r=r||{};
  const corr=Array.isArray(r.corrections)?r.corrections:[];
  const words=Array.isArray(r.words)?r.words:[];
  const sc=Number.isFinite(+r.score)?Math.max(1,Math.min(10,Math.round(+r.score))):null;
  return `
  <div class="fbk"><h4>Gesamteindruck ${sc?`<span class="score">${sc}/10</span>`:''}</h4><p>${s_(r.summary)}</p></div>
  ${isT&&r.guess?`<div class="fbk"><h4>W\u00fcrde man es erraten?</h4><p>${s_(r.guess)}</p></div>`:''}
  <div class="fbk"><h4>Korrekturen</h4>${corr.length?corr.map(c=>`<div class="corr"><span class="w">${s_(c.wrong)}</span> \u2192 <span class="r">${s_(c.right)}</span><span class="y">${s_(c.why)}</span></div>`).join(''):'<p>Keine echten Fehler gefunden \u2013 stark! \u{1F44F}</p>'}</div>
  ${r.better?`<div class="fbk"><h4>${r._claude?'Korrigierte Version':'So klingt es nat\u00fcrlich'}</h4><p>${s_(r.better)}</p><button class="spk" id="ds-spk-better" style="margin-top:10px">\u{1F50A} Anh\u00f6ren</button></div>`:''}
  ${words.length?`<div class="fbk"><h4>N\u00fctzliche W\u00f6rter f\u00fcrs n\u00e4chste Mal</h4>${words.map(w=>`<div class="nw"><b>${s_(w.en)}</b> <span>\u2013 ${s_(w.de)}</span></div>`).join('')}</div>`:''}
  ${r.tip?`<div class="fbk"><h4>Tipp</h4><p>${s_(r.tip)}</p></div>`:''}
  <div class="dsbtns" style="justify-content:center">${r._claude?`<a class="btn-g" href="${r._claude}" target="_blank" rel="noopener" style="text-decoration:none">\u{1F4AC} Ausf\u00fchrliches Feedback in Claude</a>`:''}<button class="btn-g" id="ds-again">\u270D\uFE0F Nochmal verbessern</button><button class="wr-check" id="ds-next">N\u00e4chste Aufgabe \u2192</button></div>`;
}

function norm(s){return (s||'').toLowerCase().trim().replace(/[.,!?;:"'\u2019\u201c\u201d]/g,'').replace(/\s+/g,' ').replace(/^to\s+/,'')}
function lev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  let prev=Array.from({length:n+1},(_,i)=>i),cur=new Array(n+1);
  for(let i=1;i<=m;i++){cur[0]=i;for(let j=1;j<=n;j++){const cost=a[i-1]===b[j-1]?0:1;cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+cost)}[prev,cur]=[cur,prev]}
  return prev[n];
}
function matchAns(input,answer){
  const ni=norm(input);if(!ni)return'no';
  const alts=answer.split('/').map(x=>norm(x.replace(/\([^)]*\)/g,'')));
  for(const a of alts){if(a&&ni===a)return'exact'}
  for(const a of alts){if(a&&a.length>2){const d=lev(ni,a);const th=a.length<=5?1:2;if(d<=th)return'typo'}}

const EN_CONTR=[[/\bi'm\b/g,'i am'],[/\b(you|we|they)'re\b/g,'$1 are'],[/\b(it|that|what|how|there|here|who|where|he|she)'s\b/g,'$1 is'],[/\bcan'?t\b/g,'cannot'],[/\bcan not\b/g,'cannot'],[/\bwon'?t\b/g,'will not'],[/\b(\w+)n't\b/g,'$1 not'],[/\b(do|does|did|is|are|was|were|have|has|had|should|could|would|must|need)nt\b/g,'$1 not'],[/\b(i|you|we|they|he|she|it|that)'ll\b/g,'$1 will'],[/\b(i|you|we|they|he|she)'d\b/g,'$1 would'],[/\b(i|you|we|they)'ve\b/g,'$1 have'],[/\blet's\b/g,'let us'],[/\bsth\b/g,'something'],[/\bsb\b/g,'someone']];
const EN_UK=[[/(behavi|col|fav|hon|lab|neighb|hum|rum|fl|harb|endeav)our/g,'$1or'],[/(\w{3,})is(e|es|ed|ing|ation|ations)\b/g,'$1iz$2'],[/(\w{2,})ys(e|es|ed|ing)\b/g,'$1yz$2'],[/centre/g,'center'],[/programme/g,'program'],[/travell/g,'travel'],[/cancell/g,'cancel']];
const FILL={en:/\b(just|really|very|so|quite|please|actually|pretty|a bit|a little)\b/g,de:/\b(mal|doch|bitte|ganz|halt|eben|denn|kurz|gerade|wirklich|einfach|so)\b/g};
function normA(s,lang){
  s=String(s||'').toLowerCase().replace(/[’`´]/g,"'").replace(/…|\.\.\./g,' ');
  if(lang==='en'){EN_CONTR.forEach(([r,x])=>{s=s.replace(r,x)});EN_UK.forEach(([r,x])=>{s=s.replace(r,x)})}
  else s=s.replace(/ß/g,'ss').replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue');
  s=s.replace(/[.,!?;:"„“”«»()\[\]]/g,' ').replace(/[-–]/g,' ').replace(/'/g,'').replace(/\s+/g,' ').trim();
  const lead=lang==='en'?/^(to|a|an|the)\s+/:/^(der|die|das|den|dem|ein|eine|einen|einem|sich|zu|etwas|jemanden|jemandem)\s+/;
  for(let i=0;i<3;i++)s=s.replace(lead,'');
  if(lang==='de')s=s.replace(/\b(jemanden|jemandem|jdn|jdm|etw)\b/g,'').replace(/\s+/g,' ').trim();
  return s;
}
function stripFill(s,lang){return s.replace(FILL[lang],' ').replace(/\s+/g,' ').trim()}
function ansVariants(str){
  const out=[];
  String(str||'').split('/').forEach(p=>{p=p.trim();if(!p)return;
    out.push(p);
    if(/\(.*\)/.test(p)){out.push(p.replace(/\([^)]*\)/g,' ').trim());out.push(p.replace(/[()]/g,' ').trim())}
  });
  return out.filter(Boolean);
}
const tolFor=n=>n<=4?0:n<=7?1:n<=12?2:3;
const hasNeg=s=>/\b(not|no|never|cannot|nobody|nothing|nicht|nie|niemals|kein\w*|nichts)\b/.test(s);
function tokClose(inp,cand){
  const a=inp.split(' '),b=cand.split(' ');
  if(b.length<3)return false;
  const used=new Set();let hit=0;
  b.forEach(t=>{const i=a.findIndex((x,k)=>!used.has(k)&&(x===t||(t.length>3&&lev(x,t)<=(t.length>6?2:1))));if(i>=0){used.add(i);hit++}});
  return hit/b.length>=.75&&(a.length-hit)<=2;
}
// Liefert {res:'exact'|'alt'|'typo'|'close'|'no', hit: passende Musterantwort}
function checkAnswer(input,w,answer,lang,useAlt){
  const primary=ansVariants(answer);
  const extra=useAlt&&ALT[w.en]?(ALT[w.en][lang==='en'?'e':'d']||[]):[];
  const cands=primary.map(c=>({c,alt:false})).concat(extra.map(c=>({c,alt:true})));
  const N=cands.map(o=>Object.assign({n:normA(o.c,lang)},o)).filter(o=>o.n);
  const parts=String(input||'').split(/\s*(?:\/|;|,|\boder\b|\bor\b)\s*/i).map(x=>normA(x,lang)).filter(Boolean);
  if(!parts.length)return {res:'no'};
  const rank={exact:4,alt:3,typo:2,close:1,no:0};
  const one=p=>{
    let best={res:'no'};
    const up=r=>{if(rank[r.res]>rank[best.res])best=r};
    for(const o of N){
      if(p===o.n||stripFill(p,lang)===stripFill(o.n,lang)){up({res:o.alt?'alt':'exact',hit:o.c});continue}
      if(hasNeg(p)!==hasNeg(o.n))continue;
      if(o.n.length>2&&lev(p,o.n)<=tolFor(o.n.length)){up({res:'typo',hit:o.c});continue}
      if(tokClose(stripFill(p,lang),stripFill(o.n,lang)))up({res:'close',hit:o.c});
    }
    return best;
  };
  // ganze Eingabe zuerst (Saetze mit Komma), sonst jeder Teil muss stimmen
  const whole=one(normA(input,lang));
  if(whole.res!=='no'||parts.length===1)return whole;
  const rs=parts.map(one);
  if(rs.some(r=>r.res==='no'))return {res:'no'};
  return rs.reduce((a,b)=>rank[a.res]<=rank[b.res]?a:b);
}
function otherAnswers(w,answer,lang,hit,noPrimary){
  const list=ansVariants(answer).concat(ALT[w.en]?(ALT[w.en][lang==='en'?'e':'d']||[]):[]);
  const seen=new Set([normA(hit||'',lang)].concat(noPrimary?ansVariants(answer).map(x=>normA(x,lang)):[]));
  return list.filter(x=>{const k=normA(x,lang);if(!k||seen.has(k))return false;seen.add(k);return true}).slice(0,5);
}
function buildGap(w){
  const cands=[w.en, w.en.replace(/^to\s+/i,'')];
  for(const cand of cands){
    if(!cand||cand.includes('...'))continue;
    const re=new RegExp('('+cand.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','i');
    const m=w.ex.match(re);
    if(m){const i=m.index;return {pre:w.ex.slice(0,i),target:m[0],post:w.ex.slice(i+m[0].length),answer:m[0]}}
  }
  return null;
}

const grStrip=s=>String(s==null?'':s).replace(/<[^>]+>/g,'');
const grAtt=s=>grStrip(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const grCap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const grNorm=s=>String(s).toLowerCase().replace(/’/g,"'").replace(/[.,!?;:]/g,'').replace(/\s+/g,' ').trim();
const gGet=id=>((M.gram||{})[id])||{};
function gSet(id,o){M.gram=Object.assign({},M.gram||{});M.gram[id]=Object.assign({},M.gram[id]||{},o,{t:Date.now()});saveM();}
const grSay=t=>`<button class="spkm" data-say="${grAtt(t)}" title="Anhören">\u{1F50A}</button>`;

function gBlock(b){
  if(b.h)return `<div class="gr-h">${b.h}</div>`;
  if(b.p)return `<p class="gr-p">${b.p}</p>`;
  if(b.tip)return `<div class="gr-tip">\u{1F4A1} ${b.tip}</div>`;
  if(b.f)return `<div class="gr-f">${b.f.map(([n,k],i)=>`${i?'<span class="gr-plus">+</span>':''}<span class="gr-fc" style="--c:${GPC[k][1]}">${n}</span>`).join('')}</div>`;
  if(b.sv)return `<div class="gr-sv"><div class="gr-svrow">${b.sv.map(([w,k])=>`<div class="gr-svp" style="--c:${GPC[k][1]}"><div class="gr-svw">${w}</div><div class="gr-svl">${GPC[k][0]}</div></div>`).join('')}<div class="gr-svs">${grSay(b.sv.map(x=>x[0]).join(' '))}</div></div>${b.de?`<div class="gr-svde">\u{1F1E9}\u{1F1EA} ${b.de}</div>`:''}</div>`;
  if(b.ex)return `<div class="gr-exl">${b.ex.map(([en,de])=>`<div class="gr-exi">${grSay(en)}<div><div class="gr-exen">${en}</div>${de?`<div class="gr-exde">${de}</div>`:''}</div></div>`).join('')}</div>`;
  if(b.bad)return `<div class="gr-cmp"><div class="gr-bad">✗ ${b.bad}</div><div class="gr-good">✓ ${b.good} ${grSay(b.good)}</div>${b.why?`<div class="gr-why">${b.why}</div>`:''}</div>`;
  if(b.tb)return `<div class="gr-tw"><table class="gr-tb"><thead><tr>${b.tb.h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${b.tb.r.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
  if(b.tn){const [n,f,w,s,e,d]=b.tn;return `<div class="gr-tn"><div class="gr-tnh">${n}</div><div class="gr-tnb">${f}</div><div class="gr-tnr"><span>Wann?</span>${w}</div><div class="gr-tnr"><span>Signalwörter</span>${s}</div><div class="gr-tne">${grSay(e)}<div><div class="gr-exen">${e}</div><div class="gr-exde">${d}</div></div></div></div>`}
  if(b.li)return `<div class="gr-rules">${b.li.map(([t,x,e],i)=>`<div class="gr-rule"><div class="gr-rn">${i+1}</div><div><div class="gr-rt">${t}</div><div class="gr-rx">${x}</div>${e?`<div class="gr-re">${grSay(e)} ${e}</div>`:''}</div></div>`).join('')}</div>`;
  return '';
}

function checkMC(i){

function checkOrder(){

  if(X.pick.length<X.chips.length){const fb=g('gr-fb');fb.className='qfb err';fb.innerHTML='Benutze alle Teile – es fehlen noch '+(X.chips.length-X.pick.length)+'.';return}
  X.ans=true;
  const mine=X.pick.map(ci=>X.chips[ci].w).join(' ');
  const right=x.c.join(' ');
  const ok=[right].concat(x.alt||[]).some(r=>grNorm(r)===grNorm(mine));

  g('gr-ans').classList.add(ok?'ok':'err');

  const sol=grCap(ok?mine:right)+end;
  grResult(ok,x,`<div class="gr-sol">${ok?'':'Richtig: '}<b>${sol}</b> ${grSay(sol)}</div>`);

// ── STIMME (Vorlesen) + DIKTIEREN ──
// Stimme und Tempo sind geraetespezifisch (jedes Geraet hat andere Stimmen) und liegen deshalb nur lokal.
const VK='et7_voice',VRK='et7_rate';
const VBAD=/\b(albert|bad news|bahh|bells|boing|bubbles|cellos|good news|jester|organ|superstar|trinoids|whisper|wobble|zarvox|fred|junior|ralph|kathy|grandpa|grandma|rocko|shelley|sandy|flo|eddy|reed|hysterical|deranged|pipe organ)\b/i;
const VMALE=/\b(ryan|thomas|guy|christopher|eric|andrew|brian|davis|roger|steffan|tony|jason|william|liam|daniel|arthur|oliver|aaron|alex|tom|evan|nathan|malcolm|george|james|male|markus|yannick|conrad|killian|florian|ralf|hans|jonas)\b/i;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
function allVoices(){try{return window.speechSynthesis?speechSynthesis.getVoices():[]}catch(e){return[]}}
function voiceScore(v,lang){
  const n=v.name||'',l=(v.lang||'').replace('_','-');
  if(VBAD.test(n))return -1;
  let s=0;
  if(/natural|online|neural/i.test(n))s+=60;
  if(/premium|enhanced|erweitert|verbessert/i.test(n))s+=45;
  if(/google/i.test(n))s+=20;
  if(VMALE.test(n))s+=35;
  if(/female|frau|samantha|karen|moira|tessa|serena|kate|susan|zira|hazel|libby|sonia|aria|jenny|anna|helena|petra|katja|amala|vicki/i.test(n))s-=30;
  if(l.toLowerCase()===lang.toLowerCase())s+=8;
  if(!v.localService)s+=5;
  return s;
}
function voicesFor(lang){
  const pre=lang.slice(0,2).toLowerCase();
  return allVoices().filter(v=>(v.lang||'').toLowerCase().replace('_','-').startsWith(pre)&&!VBAD.test(v.name||''))
    .sort((a,b)=>voiceScore(b,lang)-voiceScore(a,lang));
}
function pickVoice(lang){
  const list=voicesFor(lang);
  if(lang.startsWith('en')&&lsGet(VK)==='__system__')return 'SYS';
  if(!list.length)return null;
  if(lang.startsWith('en')){const want=lsGet(VK);if(want==='__system__')return 'SYS';if(want){const v=list.find(x=>x.name===want);if(v)return v}}
  return list[0];
}
const vRate=()=>{const r=+lsGet(VRK);return r>0?r:.95};

let dictRec=null,dictOn=false,dictBroken=false;
const IS_MAC=/Mac/i.test(navigator.platform||navigator.userAgent||'');

const DICT_HELP_MAC='<br><br>Ausweg: das <b>Mac-Diktat</b>. Das Textfeld ist schon aktiv – drück <b>zweimal die Fn-Taste</b> (oder die \u{1F3A4}-Taste oben auf der Tastatur) und sprich Englisch.<br><span style="color:var(--t3)">Einmalig einrichten: <i>Systemeinstellungen → Tastatur → Diktat</i> einschalten und bei „Sprachen“ Englisch hinzufügen.</span>';
