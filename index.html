// ── Eigene Spracherkennung: Aufnahme im Trainer + Whisper direkt auf dem Geraet (transformers.js) ──
const TJS_URL='https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1';
const ASR_MODEL='Xenova/whisper-base.en';
const DMK='et7_dictmode';
let asrPipe=null,asrLoading=null,asrProg='',wRec=null,wStream=null,wChunks=[],wOn=false,wBusy=false,wDiscard=false,wPhase='';
function wShow(){
  if(wOn)dictStatus('\u{1F534} Aufnahme läuft – sprich auf Englisch und tippe dann auf „Fertig gesprochen“.'+(asrProg&&!asrPipe?`<br><span style="color:var(--t3)">Sprachmodell lädt im Hintergrund: ${asrProg}</span>`:''));
  else if(wPhase==='load')dictStatus('⏳ Sprachmodell wird geladen'+(asrProg?': '+asrProg:' …')+'<br><span style="color:var(--t3)">Nur beim ersten Mal (ca. 77 MB), danach ist es gespeichert.</span>');
  else if(wPhase==='asr')dictStatus('⏳ Wird in Text umgewandelt …');
}
function loadASR(){
  if(asrPipe)return Promise.resolve(asrPipe);
  if(!asrLoading){
    asrLoading=(async()=>{
      const T=await import(TJS_URL);
      T.env.allowLocalModels=false;
      const files={};
      return await T.pipeline('automatic-speech-recognition',ASR_MODEL,{dtype:'q8',device:'wasm',progress_callback:p=>{
        if(!p||p.status!=='progress'||!p.file)return;
        files[p.file]=[p.loaded||0,p.total||0];
        let l=0,t=0;Object.values(files).forEach(([a,b])=>{l+=a;t+=b});
        asrProg=t?Math.round(l/t*100)+' %':'';wShow();
      }});
    })().then(p=>{asrPipe=p;asrProg='';return p}).catch(e=>{asrLoading=null;asrProg='';throw e});
  }
  return asrLoading;
}
async function wStart(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){dictFail('Dieser Browser kann keine Audioaufnahme.');return}
  try{wStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}})}
  catch(e){dictFail('Der Trainer darf hier nicht aufs Mikrofon zugreifen'+(e&&e.name?' ('+e.name+')':'')+'.');return}
  loadASR().catch(()=>{});
  wChunks=[];wDiscard=false;
  let mime='';
  for(const m of ['audio/webm;codecs=opus','audio/webm','audio/mp4']){try{if(MediaRecorder.isTypeSupported(m)){mime=m;break}}catch(e){}}
  try{wRec=new MediaRecorder(wStream,mime?{mimeType:mime}:undefined)}catch(e){wRelease();dictFail('Die Aufnahme konnte nicht gestartet werden.');return}
  wRec.ondataavailable=e=>{if(e.data&&e.data.size)wChunks.push(e.data)};
  wRec.onstop=wFinish;
  wRec.start(250);wOn=true;dictOn=true;dictBtn();wShow();
}
function wRelease(){try{wStream&&wStream.getTracks().forEach(t=>t.stop())}catch(e){}wStream=null}
function wStop(){if(wRec&&wRec.state!=='inactive'){try{wRec.stop()}catch(e){}}}
async function decode16k(blob){
  const buf=await blob.arrayBuffer();
  const AC=window.AudioContext||window.webkitAudioContext;
  let ctx;try{ctx=new AC({sampleRate:16000})}catch(e){ctx=new AC()}
  const ab=await new Promise((res,rej)=>{const p=ctx.decodeAudioData(buf,res,rej);if(p&&p.then)p.then(res,rej)});
  try{ctx.close()}catch(e){}
  if(ab.sampleRate===16000)return ab.getChannelData(0);
  const off=new OfflineAudioContext(1,Math.ceil(ab.duration*16000),16000);
  const src=off.createBufferSource();src.buffer=ab;src.connect(off.destination);src.start();
  return (await off.startRendering()).getChannelData(0);
}
async function wFinish(){
  wOn=false;dictOn=false;wRelease();
  if(wDiscard){wDiscard=false;dictBtn();return}
  const blob=new Blob(wChunks,{type:(wRec&&wRec.mimeType)||'audio/webm'});wChunks=[];
  if(blob.size<2000){dictBtn();dictStatus('Keine Aufnahme angekommen – sprich etwas länger und tippe dann auf „Fertig gesprochen“.');return}
  wBusy=true;dictBtn();
  let step='load';
  try{
    wPhase='load';wShow();
    const pipe=await loadASR();
    step='decode';wPhase='asr';wShow();
    const audio=await decode16k(blob);
    step='asr';
    const out=await pipe(audio,{chunk_length_s:30,stride_length_s:5});
    let txt=(Array.isArray(out)?out.map(o=>o.text).join(' '):(out&&out.text)||'').replace(/\s+/g,' ').trim();
    if(!txt||/^[\[(].*[\])]$/.test(txt)){dictStatus('Ich habe leider nichts verstanden – versuch es nochmal etwas lauter.');return}
    const ta=g('ds-in');
    if(ta){const base=ta.value.replace(/\s+$/,'');ta.value=(base?base+' ':'')+txt;if(ta.oninput)ta.oninput();try{ta.focus()}catch(e){}}
    dictStatus('✅ Eingefügt – du kannst den Text noch korrigieren oder weiter diktieren.');
  }catch(e){
    const why=e&&(e.message||e.name)?' ('+String(e.message||e.name).slice(0,120)+')':'';
    if(step==='load')dictLastErr='Das Sprachmodell konnte nicht geladen werden'+why+'.';
    else if(step==='decode')dictLastErr='Die Aufnahme konnte nicht gelesen werden'+why+'.';
    else dictLastErr='Die Umwandlung in Text ist fehlgeschlagen'+why+'.';
    dictStatus('⚠️ '+dictLastErr+(IS_MAC?DICT_HELP_MAC:DICT_HELP_GEN));
  }finally{wBusy=false;wPhase='';dictBtn()}
}

function dictStop(){
  if(wOn){wDiscard=true;wStop()}
  if(dictRec&&dictOn){try{dictRec.stop()}catch(e){}}
}
function dictBusy(){return wOn||wBusy||(dictOn&&!!dictRec)}
function toggleDictate(){
  const ta=g('ds-in');if(!ta||wBusy)return;
  if(dictOn){if(wOn)wStop();else if(dictRec){try{dictRec.stop()}catch(e){}}return}
  if(dictBroken){dictFail();return}
  // Eingebaute Spracherkennung des Browsers zuerst; wenn sie hier nicht geht (z. B. Claude-Desktop-App), eigene Aufnahme + Whisper
  if(!SRec||lsGet(DMK)==='w'){wStart();return}
  let r;
  try{r=new SRec()}catch(e){lsSet(DMK,'w');wStart();return}
  r.lang='en-GB';r.continuous=true;r.interimResults=true;r.maxAlternatives=1;
  const base=ta.value.replace(/\s+$/,'');
  let gotAny=false,failed=false;
  r.onresult=e=>{
    let all='';
    for(let i=0;i<e.results.length;i++)all+=e.results[i][0].transcript;
    all=all.replace(/\s+/g,' ').trim();
    if(all){gotAny=true;if(!base||/[.!?]$/.test(base))all=all.charAt(0).toUpperCase()+all.slice(1)}
    ta.value=(base?base+' ':'')+all;
    if(ta.oninput)ta.oninput();
  };
  r.onerror=e=>{
    const c=e&&e.error;
    if(c==='no-speech'){dictStatus('Ich habe nichts gehört – sprich etwas lauter oder näher am Mikrofon.');return}
    if(c==='aborted')return;
    failed=true;
  };
  r.onend=()=>{
    dictOn=false;dictRec=null;dictBtn();
    if(failed&&!gotAny){lsSet(DMK,'w');dictStatus('Die eingebaute Spracherkennung geht hier nicht – ich nehme jetzt selbst auf …');wStart();return}
    const s=g('ds-mic-st');if(s&&s.textContent.startsWith('\u{1F534}'))dictStatus('');
  };
  try{r.start()}catch(e){lsSet(DMK,'w');wStart();return}
  dictRec=r;dictOn=true;dictBtn();
  dictStatus('\u{1F534} Ich höre zu – sprich auf Englisch. Zum Beenden auf „Fertig gesprochen“ tippen.');
}

// ── CLOUD-SYNC über das Claude-Konto ──
// Lokal bleibt als schneller Zwischenspeicher; der Stand wird pro Person privat in der Artifact-Datenbank gesichert
// und beim Öffnen mit dem lokalen Stand zusammengeführt (pro Vokabel gewinnt der neuere Lernstand).
const TSK='et7_ts',RSK='et7_reset';
let syncRef=null,syncTimer=null,syncBusy=false,syncAgain=false,syncMode='wait';
const lsNum=k=>{try{return +(localStorage.getItem(k)||0)}catch(e){return 0}};
function touchLocal(){try{localStorage.setItem(TSK,String(Date.now()))}catch(e){}}
function markReset(){try{localStorage.setItem(RSK,String(Date.now()))}catch(e){}}
function writeLocal(){try{localStorage.setItem(SK,JSON.stringify(P));localStorage.setItem(MK,JSON.stringify(M));localStorage.setItem(DK,JSON.stringify(DSM))}catch(e){}}
function setSync(m){
  syncMode=m;const el=g('sync-st');if(!el)return;
  el.textContent={ok:'\u2601\uFE0F Fortschritt wird \u00fcber dein Claude-Konto synchronisiert',wait:'\u2601\uFE0F Verbinde mit deinem Claude-Konto \u2026',local:'\u{1F4BE} Fortschritt nur auf diesem Ger\u00e4t gespeichert (Synchronisierung hier nicht verf\u00fcgbar)',err:'\u26A0\uFE0F Synchronisierung gerade gest\u00f6rt \u2013 lokal gespeichert, wird sp\u00e4ter nachgeholt'}[m]||'';
  if(window.ET_STANDALONE)el.textContent=el.textContent.replace('dein Claude-Konto','GitHub').replace('deinem Claude-Konto','GitHub').replace('(Synchronisierung hier nicht verf\u00fcgbar)','');
}
function schedulePush(){touchLocal();if(!syncRef)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>{syncTimer=null;syncPush()},1500)}
function snapshotLocal(){return {v:1,P,M,D:DSM,ts:lsNum(TSK)||Date.now(),resetAt:lsNum(RSK)}}
async function syncPush(){
  if(!syncRef)return;
  if(syncBusy){syncAgain=true;return}
  syncBusy=true;
  try{const s=snapshotLocal();await syncRef.set({state:JSON.stringify(s),updatedAt:s.ts});setSync('ok')}
  catch(e){setSync('err')}
  finally{syncBusy=false;if(syncAgain){syncAgain=false;syncPush()}}
}
function flushPush(){if(syncTimer){clearTimeout(syncTimer);syncTimer=null;syncPush()}}
function pickEntry(a,b){
  if(!a)return b;if(!b)return a;
  if(a.t||b.t)return (a.t||0)>=(b.t||0)?a:b;
  const na=(a.reps||0)+(a.lapses||0),nb=(b.reps||0)+(b.lapses||0);
  if(na!==nb)return na>nb?a:b;
  return (a.due||'')>=(b.due||'')?a:b;
}
function mergeM(a,b,bNewer){
  a=a||{};b=b||{};const o=Object.assign({},bNewer?a:b,bNewer?b:a);
  const la=a.lastDay||'',lb=b.lastDay||'';
  const src=la>=lb?a:b;o.lastDay=src.lastDay;o.streak=src.streak;
  o.totalReviews=Math.max(a.totalReviews||0,b.totalReviews||0);
  o.totalCorrect=Math.max(a.totalCorrect||0,b.totalCorrect||0);
  if((a.dayOf||'')===(b.dayOf||'')){o.dayOf=a.dayOf;o.todayCount=Math.max(a.todayCount||0,b.todayCount||0)}
  else{const d=(a.dayOf||'')>(b.dayOf||'')?a:b;o.dayOf=d.dayOf;o.todayCount=d.todayCount}
  const ga=a.gram||{},gb=b.gram||{},gm={};
  new Set([...Object.keys(ga),...Object.keys(gb)]).forEach(k=>{const x=ga[k],y=gb[k];if(!x){gm[k]=y;return}if(!y){gm[k]=x;return}const n=(x.t||0)>=(y.t||0)?x:y;gm[k]=Object.assign({},n,{b:Math.max(x.b||0,y.b||0),r:x.r||y.r})});
  if(Object.keys(gm).length)o.gram=gm;
  return o;
}
function mergeAll(loc,rem){
  if((rem.resetAt||0)>(loc.ts||0))return {P:rem.P||{},M:rem.M||{},D:rem.D||{},resetAt:rem.resetAt};
  if((loc.resetAt||0)>(rem.ts||0))return {P:loc.P||{},M:loc.M||{},D:loc.D||{},resetAt:loc.resetAt};
  const out={};const keys=new Set([...Object.keys(loc.P||{}),...Object.keys(rem.P||{})]);
  keys.forEach(k=>{const v=pickEntry((loc.P||{})[k],(rem.P||{})[k]);if(v)out[k]=v});
  const remNewer=(rem.ts||0)>(loc.ts||0);
  const D=Object.assign({},remNewer?loc.D:rem.D,remNewer?rem.D:loc.D);
  D.count=Math.max((loc.D||{}).count||0,(rem.D||{}).count||0);
  return {P:out,M:mergeM(loc.M,rem.M,remNewer),D,resetAt:Math.max(loc.resetAt||0,rem.resetAt||0)};
}
function rerenderActive(){
  try{
    if(g('tab-dash').classList.contains('on'))renderDash();
    if(g('tab-br').classList.contains('on'))renderBR();
    if(g('ds-count'))g('ds-count').textContent=DSM.count||0;
    if(g('tab-gr').classList.contains('on')&&!grCur)renderGRList();
  }catch(e){}
}
async function syncPull(){
  if(!syncRef)return;
  if(syncTimer){clearTimeout(syncTimer);syncTimer=null;await syncPush()}
  try{
    const snap=await syncRef.get();
    let rem=null;
    if(snap.exists){try{rem=JSON.parse(String(snap.data().state||''))}catch(e){rem=null}}
    if(!rem){await syncPush();return}
    const loc=snapshotLocal();
    const m=mergeAll(loc,rem);
    const merged=JSON.stringify({P:m.P,M:m.M,D:m.D});
    const changedLocal=merged!==JSON.stringify({P:loc.P,M:loc.M,D:loc.D});
    const changedRemote=merged!==JSON.stringify({P:rem.P||{},M:rem.M||{},D:rem.D||{}});
    if(changedLocal){P=m.P;M=m.M;DSM=m.D;writeLocal();try{if(m.resetAt)localStorage.setItem(RSK,String(m.resetAt))}catch(e){}rerenderActive()}
    if(changedRemote){touchLocal();await syncPush()}else setSync('ok');
  }catch(e){setSync('err')}
}
(async()=>{
  setSync('wait');
  try{
    if(!(window.claude&&claude.use)){setSync('local');return}
    const [db,us]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!us){setSync('local');return}
    const uid=await us.id();
    if(!uid){setSync('local');return}
    syncRef=db.doc('data/users/'+uid+'/trainer');
    await syncPull();
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncPull();else flushPush()});
    window.addEventListener('pagehide',flushPush);
  }catch(e){setSync('local')}
})();

const LEARNER='Du bist mein Englisch-Coach. Ich bin deutscher Muttersprachler, Niveau etwa B2 (Grammatik und Lesen sind okay), und will vor allem freier und sicherer sprechen – im Job (Industrie/Technik, Angebote, Meetings) und im Alltag. Ich übe mit meinem eigenen „English Trainer“.';
const DS_SCHEMA=`1. **Gesamtnote 1–10** und je ein kurzer Satz zu Grammatik, Wortschatz, Natürlichkeit und Verständlichkeit. Bei Umschreiben-Übungen: welches Wort ein Zuhörer wohl erraten würde.

6. Zum Schluss eine kurze **Anschlussfrage auf Englisch**, damit ich direkt weiterüben kann – meine Antwort darauf korrigierst du wieder genauso.`;
const GR_SCHEMA=`1. Klar sagen: **richtig oder falsch?** Wenn falsch: korrigierte Version und warum (kurz auf Deutsch, mit Bezug auf die Regel).
2. Wie ein Muttersprachler es **natürlich** sagen würde – falls das anders ist.
3. **3 neue Übungssätze** auf Deutsch zu genau dieser Regel zum Übersetzen. Auf meine Antworten warten und sie dann korrigieren.`;
const COACH_SETUP=`${LEARNER}

Ich schicke dir hier immer wieder Übungen aus meinem Trainer. Es gibt zwei Arten:

**A) Beschreiben / Umschreiben** („\u{1F4DD} Neue Übung“): Ich erkläre etwas in eigenen Worten auf Englisch. Bewerte dann immer so:
${DS_SCHEMA}

**B) Grammatik-Check** („\u{1F4D0} Grammatik-Check“): Ich bilde einen eigenen Satz zu einer Grammatik-Regel. Antworte dann immer so:
${GR_SCHEMA}

Erklärungen immer auf Deutsch, Beispiele auf Englisch. Sei ermutigend, aber ehrlich. Merk dir über die Übungen hinweg, welche Fehler ich oft mache, und weise mich darauf hin, wenn sie wieder auftauchen.`;

function copySync(text){
  try{const ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:-1000px;opacity:0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(ok)return true}catch(e){}
  try{navigator.clipboard.writeText(text);return true}catch(e){}
  return false;
}
function openClaude(prompt){
  const copied=copySync(prompt);
  const c=fbCfg(),app=claudeTarget()==='app',base=app?'claude://claude.ai/':'https://claude.ai/';
  const url=c.mode==='new'?base+'new?q='+encodeURIComponent(prompt.slice(0,13000)):base+c.type+'/'+c.id;
  if(app)location.href=url;else window.open(url,'_blank','noopener');
  return copied;
}
function handoffNote(copied,prompt,nextId){
  const c=fbCfg();
  const paste=IS_MOBILE?'ins Eingabefeld tippen → <b>Einsetzen</b>':'<b>⌘V</b> drücken';
  const body=c.mode==='new'
    ?`Deine Aufgabe, dein Text und das Bewertungsschema stehen schon im Eingabefeld – nur noch <b>senden</b>.${copied?' Falls das Feld leer ist: '+paste+', der Text ist kopiert.':''}`
    :copied
      ?`Dein ${c.mode==='chat'?'Coach-Chat':'Coach-Projekt'} ist offen und der Text ist kopiert: ${c.mode==='project'?'Chat im Projekt öffnen (neu oder den letzten), dann ':''}${paste} und senden.`
      :`Dein ${c.mode==='chat'?'Coach-Chat':'Coach-Projekt'} ist offen. Kopieren hat nicht geklappt – tipp auf „Text kopieren“ und füge ihn dort ein.`;
  return `<div class="fbk"><h4>\u{1F4AC} Claude geöffnet</h4><p>${body}</p>
  <div class="dsbtns" style="margin-top:12px;margin-bottom:0"><button class="btn-g" data-ho="open">↗ Nochmal öffnen</button><button class="btn-g" data-ho="copy">\u{1F4CB} Text kopieren</button>${nextId?`<button class="wr-check" id="${nextId}">Nächste Aufgabe →</button>`:''}</div></div>`;
}
function wireHandoff(box,prompt){
  box.querySelectorAll('[data-ho]').forEach(b=>b.onclick=()=>{
    if(b.dataset.ho==='open')openClaude(prompt);
    else{const ok=copySync(prompt);b.textContent=ok?'✅ Kopiert':'Kopieren ging nicht';}
  });
}
function dsPrompt(t,txt){
  const isT=t.c==='taboo',full=fbCfg().mode==='new';
  const task=isT
    ?`Umschreiben: Ich soll das englische Wort „${t.word}“ auf Englisch erklären, OHNE es selbst zu benutzen, so dass jemand es erraten kann.`
    :`Thema: ${t.de}${t.en?' (Englisch: '+t.en+')':''}\nAufgabe: ${t.task}${t.h&&t.h.length?'\nMögliche Hilfswörter: '+t.h.join(', '):''}`;
  const core=`\u{1F4DD} Neue Übung – ${isT?'Umschreiben':'Beschreiben'}\n${task}\n\nMein Text:\n"""\n${txt}\n"""`;
  return full
    ?`${LEARNER}\n\n${core}\n\nBitte bewerte das so:\n${DS_SCHEMA}\n\nErklärungen auf Deutsch, Beispiele auf Englisch. Sei ermutigend, aber ehrlich.`
    :`${core}\n\nBitte wie immer bewerten (Note, Fehlertabelle, Muttersprachler-Version, neue Wörter, Tipp, Anschlussfrage).`;
}
function grPrompt(l,txt){
  const full=fbCfg().mode==='new';
  const rules=l.b.filter(x=>x.tip||x.p||x.bad).map(x=>x.bad?'Falsch: '+grStrip(x.bad)+' → Richtig: '+grStrip(x.good):grStrip(x.tip||x.p)).join('\n- ');
  const core=`\u{1F4D0} Grammatik-Check – Lektion „${l.t}“ (${l.sub})\nRegeln:\n- ${rules}\n\nMein Satz:\n"""\n${txt}\n"""`;
  return full
    ?`${LEARNER}\n\n${core}\n\nBitte:\n${GR_SCHEMA}`
    :`${core}\n\nBitte wie immer: richtig/falsch mit Korrektur, natürliche Version, 3 neue Übungssätze.`;
}
function fbSettingsHTML(){
  const c=fbCfg(),f=(M&&M.fb)||{},link=f.id?`https://claude.ai/${f.type}/${f.id}`:'';
  return `
      <div class="vb-hint" style="margin:4px 0 8px">„Feedback in Claude holen“ läuft über dein Claude-Abo, ohne Zusatzkosten.</div>
      <div class="vb-row" style="margin-bottom:8px">
        <select class="sel" id="st-fbmode">
          <option value="new"${c.mode==='new'?' selected':''}>Jedes Mal neuer Chat (Text vorausgefüllt)</option>
          <option value="fixed"${c.mode!=='new'||(f.mode==='fixed'&&!f.id)?' selected':''}>Immer mein Coach-Chat / -Projekt</option>
        </select>
        <select class="sel" id="st-claude"><option value="app"${claudeTarget()==='app'?' selected':''}>In der Claude-App</option><option value="web"${claudeTarget()==='web'?' selected':''}>Im Browser (claude.ai)</option></select>
      </div>
      <div id="st-fbfixed" style="display:${c.mode!=='new'||f.mode==='fixed'?'block':'none'}">
        <div class="vb-hint" style="margin-bottom:8px"><b>Einmal einrichten:</b><br>
          <b>Variante Projekt</b> (empfohlen): In Claude ein Projekt „English Coach“ anlegen, die Coach-Anweisungen (Knopf unten) bei <i>Anweisungen</i> einfügen, dann den Link des Projekts hier eintragen.<br>
          <b>Variante Chat:</b> Neuen Chat starten, die Coach-Anweisungen als erste Nachricht schicken, dann den Link dieses Chats hier eintragen.</div>
        <div class="vb-row"><input class="brsearch" id="st-fblink" placeholder="https://claude.ai/project/… oder https://claude.ai/chat/…" value="${esc(link)}" autocomplete="off"><button class="btn-g" id="st-fbsave">Speichern</button></div>
        <div class="vb-row" style="margin-top:8px"><button class="btn-g" id="st-fbsetup">\u{1F4CB} Coach-Anweisungen kopieren</button>${c.mode!=='new'?'<button class="btn-g" id="st-fbopen">↗ Coach öffnen</button>':''}</div>
        <div class="st-msg" id="st-fbmsg">${c.mode!=='new'?'✅ Verbunden mit deinem Coach-'+(c.type==='chat'?'Chat':'Projekt')+'.':''}</div>
      </div>`;
}
function wireFbSettings(){
  if(!g('st-fbmode'))return;
  const msg=(t,ok)=>{const m=g('st-fbmsg');m.textContent=t;m.style.color=ok?'var(--gn)':'var(--rd)'};
  g('st-claude').onchange=e=>lsSet(CLM,e.target.value);
  g('st-fbmode').onchange=e=>{
    const fixed=e.target.value==='fixed';
    M.fb=Object.assign({},M.fb||{},{mode:fixed?'fixed':'new'});saveM();
    g('st-fbfixed').style.display=fixed?'block':'none';
  };
  g('st-fbsave').onclick=()=>{
    const L=parseClaudeLink(g('st-fblink').value);
    if(!L){msg('Das ist kein Claude-Link. Er muss so aussehen: https://claude.ai/project/… oder https://claude.ai/chat/…');return}
    M.fb={mode:'fixed',type:L.type,id:L.id};saveM();
    msg('✅ Gespeichert – Feedback landet ab jetzt immer in deinem Coach-'+(L.type==='chat'?'Chat':'Projekt')+'.',true);
  };
  g('st-fbsetup').onclick=()=>{const ok=copySync(COACH_SETUP);msg(ok?'✅ Coach-Anweisungen kopiert – jetzt in Claude einfügen.':'Kopieren ging nicht.',ok)};
  if(g('st-fbopen'))g('st-fbopen').onclick=()=>{const c=fbCfg(),app=claudeTarget()==='app',u=(app?'claude://claude.ai/':'https://claude.ai/')+c.type+'/'+c.id;if(app)location.href=u;else window.open(u,'_blank','noopener')};
}

// ── EINSTELLUNGEN: Web-App (Feedback-Ziel, API-Key, Sync) ──

  const el=g('set-box');if(!el)return;
  const W=!!window.ET_STANDALONE;
  let h='';
  if(W){
    const K=window.ET_web.keys;
    const hasKey=!!lsGet(K.KK),hasTok=!!lsGet(K.GT);
    h+=`
    <div class="st-sec">
      <div class="st-h">\u{1F916} Feedback <span class="st-ok">${hasKey?'Claude-API aktiv':'\u00fcber Claude'}</span></div>
      ${hasKey?'<div class="vb-hint" style="margin:4px 0 8px">Feedback kommt direkt in der App \u00fcber deinen API-Key.</div>':fbSettingsHTML()}
      <details class="st-adv"${hasKey?' open':''}><summary>Optional: eigener Anthropic-API-Key (kostenpflichtig)</summary>
      <div class="vb-hint" style="margin:6px 0 8px">Dann kommt das ausf\u00fchrliche Feedback direkt in der App. Key unter <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>, wird nur auf diesem Ger\u00e4t gespeichert.</div>
      <div class="vb-row"><input class="brsearch" type="password" id="st-key" placeholder="${hasKey?'\u2022\u2022\u2022\u2022\u2022\u2022 gespeichert \u2013 neuen Key einf\u00fcgen zum \u00c4ndern':'sk-ant-\u2026'}" autocomplete="off"><button class="btn-g" id="st-key-save">Speichern</button>${hasKey?'<button class="btn-g" id="st-key-test">Testen</button><button class="btn-g" id="st-key-del">Entfernen</button>':''}</div>
      <div class="st-msg" id="st-key-msg"></div>
      </details>
    </div>
    </div>`;
  }
  el.innerHTML=h;
  const lb=g('set-lbl');if(lb)lb.style.display=W?'':'none';el.style.display=W?'':'none';

    const K=window.ET_web.keys;

    g('st-key-save').onclick=()=>{const v=g('st-key').value.trim();if(!/^sk-ant-/.test(v)){msg('st-key-msg','Das sieht nicht wie ein Anthropic-Key aus (beginnt mit sk-ant-).');return}lsSet(K.KK,v);msg('st-key-msg','Gespeichert – die Seite lädt neu …',true);setTimeout(()=>location.reload(),600)};
    wireFbSettings();
    if(g('st-key-test'))g('st-key-test').onclick=async()=>{msg('st-key-msg','Teste …',true);try{const r=await window.ET_web.ask('Reply with exactly: OK',{modelTier:'quick',maxTokens:10});msg('st-key-msg','✅ Funktioniert ('+String(r.text).trim().slice(0,20)+')',true)}catch(e){msg('st-key-msg','❌ '+(e.message||'Fehler'))}};
    if(g('st-key-del'))g('st-key-del').onclick=()=>{lsSet(K.KK,null);location.reload()};
  }

}

// ── VERSION & UPDATES ──
// APP_VERSION/APP_NOTES setzt tools/release.py bei jeder Veroeffentlichung; version.json im Repo enthaelt die neueste Version.
const APP_VERSION='2026-11-28T10:50:04Z';
const APP_NOTES="Vorbereitung für Aufnahmen mit deiner Mac-Stimme (Evan).";
let updInfo=null,updTimer=null;
function fmtVer(v){try{return new Date(v).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})+' Uhr'}catch(e){return v}}
function renderVer(msg){
  const el=g('ver-box');if(!el)return;
  el.innerHTML=`<div class="ver-row"><span>\u{1F552} Zuletzt aktualisiert: <b>${esc(fmtVer(APP_VERSION))}</b></span>${window.ET_STANDALONE?'<button class="btn-g" id="ver-check">\u{1F504} Nach Updates suchen</button>':''}</div>
    ${updInfo?`<div class="ver-new">\u{1F195} Neue Version vom ${esc(fmtVer(updInfo.version))} verfügbar <button class="wr-check" id="ver-apply">Jetzt aktualisieren</button></div>`:''}
    ${APP_NOTES?`<div class="ver-notes">Neu in dieser Version: ${esc(APP_NOTES)}</div>`:''}
    ${msg?`<div class="ver-notes">${msg}</div>`:''}`;
  if(g('ver-check'))g('ver-check').onclick=()=>checkUpdate(true);
  if(g('ver-apply'))g('ver-apply').onclick=applyUpdate;
}
function showUpdBar(){
  const b=g('upd-bar');if(!b||!updInfo)return;
  b.innerHTML=`<div class="updin"><span>\u{1F195} <b>Neue Version verfügbar</b>${updInfo.notes?' – '+esc(updInfo.notes):''}</span><button class="wr-check" id="upd-go">Jetzt aktualisieren</button></div>`;
  b.style.display='block';
  g('upd-go').onclick=applyUpdate;
}
async function checkUpdate(manual){
  if(!window.ET_STANDALONE)return;
  if(manual)renderVer('Suche …');
  try{
    const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    const j=await r.json();
    if(j&&j.version&&j.version>APP_VERSION){updInfo=j;showUpdBar();renderVer()}
    else renderVer(manual?'✅ Du hast die neueste Version.':'');
  }catch(e){renderVer(manual?'Konnte gerade nicht nach Updates suchen – bist du online?':'')}
}
function applyUpdate(){
  try{flushPush();writeLocal()}catch(e){}
  const v=updInfo?updInfo.version:String(Date.now());
  location.replace(location.pathname+'?v='+encodeURIComponent(v));
}
renderVer();
loadAud();
if(window.ET_STANDALONE){
  setTimeout(()=>checkUpdate(false),1500);
  updTimer=setInterval(()=>checkUpdate(false),10*60*1000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate(false)});
}

renderSettings();
renderDash();
